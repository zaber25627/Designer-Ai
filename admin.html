<!DOCTYPE html>
<html lang="en" data-theme="sapphire">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060A18">
<meta name="robots" content="noindex,nofollow">
<script>try{var t=localStorage.getItem("adm_theme");document.documentElement.setAttribute("data-theme",t==="violet"||t==="gold"?t:"sapphire")}catch(e){}</script>
<title>NEXAVAULT Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#050506;--bg2:#0B0B0D;--panel:rgba(20,20,24,.82);--panel2:rgba(255,255,255,.035);--line:rgba(205,210,222,.11);--line2:rgba(255,255,255,.065);
  --text:#F4F4F6;--mute:#A6A9B3;--dim:#6E7079;--acc:#7B61FF;--acc2:#FF9D4D;--gold:#F2B84B;--ti:#C9CED8;--ti2:#8E94A3;
  --pos:#3DDC97;--neg:#FF5C6C;--warn:#FFC857;--info:#5AB0FF;--vio:#B58CFF;
  --r:16px;--rs:10px;--side:272px;--top:66px;--sh:0 24px 60px -20px rgba(0,0,0,.85);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 520px at 6% -8%,rgba(255,122,26,.13),transparent 60%),radial-gradient(760px 520px at 100% 105%,rgba(201,206,216,.07),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.012),transparent 30%)}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:rgba(201,206,216,.22);border-radius:9px}::-webkit-scrollbar-thumb:hover{background:rgba(255,122,26,.5)}::-webkit-scrollbar-track{background:transparent}
a{color:var(--acc2);text-decoration:none}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,.sv{font-family:'Space Grotesk','Inter',sans-serif}
.num,.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* boot + login */
#boot{position:fixed;inset:0;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg)}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(201,206,216,.15);border-top-color:var(--acc);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.gate{position:fixed;inset:0;z-index:4000;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);overflow:auto}
.gbox{position:relative;z-index:1;width:100%;max-width:420px;background:linear-gradient(180deg,rgba(28,28,33,.9),rgba(14,14,17,.92));border:1px solid var(--line);border-radius:22px;padding:30px 26px;backdrop-filter:blur(22px);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.06)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.2rem;color:#1a0d02;background:linear-gradient(135deg,#E8EBF1,var(--acc));box-shadow:0 8px 22px rgba(255,122,26,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.logo b{font-size:1.15rem;letter-spacing:.6px;font-weight:700;font-family:'Space Grotesk',sans-serif}.logo small{display:block;font-size:.66rem;color:var(--ti2);letter-spacing:1.8px;text-transform:uppercase;font-weight:600}
.gbox h2{font-size:1.15rem;margin-bottom:4px}.gbox p.sub{color:var(--mute);font-size:.82rem;margin-bottom:18px}
.err{background:rgba(255,92,108,.1);border:1px solid rgba(255,92,108,.3);color:#ffb3bb;padding:10px 12px;border-radius:10px;font-size:.8rem;margin-bottom:12px}

/* layout */
#app{position:relative;z-index:1}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);z-index:900;background:linear-gradient(180deg,rgba(14,14,17,.97),rgba(8,8,10,.98));backdrop-filter:blur(20px);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.side .logo{padding:20px 18px;margin:0;border-bottom:1px solid var(--line2)}
.nav{flex:1;overflow-y:auto;padding:10px 10px 16px}
.nsec{font-size:.6rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);font-weight:700;padding:16px 12px 6px}
.ni{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--mute);font-weight:600;font-size:.83rem;cursor:pointer;margin-bottom:2px;position:relative;border:1px solid transparent;transition:.2s}
.ni i{width:18px;text-align:center;font-size:.88rem;transition:.2s}
.ni:hover{background:rgba(255,255,255,.04);color:var(--text);transform:translateX(2px)}
.ni:hover i{color:var(--acc2)}
.ni.on{background:linear-gradient(135deg,rgba(255,122,26,.17),rgba(201,206,216,.05));color:#fff;border-color:rgba(255,122,26,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.ni.on i{color:var(--acc)}
.ni.on::before{content:'';position:absolute;left:-10px;top:22%;bottom:22%;width:3px;border-radius:0 4px 4px 0;background:linear-gradient(var(--ti),var(--acc))}
.bdg{margin-left:auto;background:linear-gradient(135deg,#ff7b88,#e0384c);color:#fff;border-radius:99px;font-size:.62rem;font-weight:800;padding:2px 7px;min-width:20px;text-align:center}
.sfoot{padding:12px;border-top:1px solid var(--line2);font-size:.74rem;color:var(--mute)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:890;display:none}.scrim.show{display:block}
.top{position:fixed;top:0;left:var(--side);right:0;height:var(--top);z-index:800;display:flex;align-items:center;gap:12px;padding:0 24px;background:rgba(8,8,10,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--line2)}
.top h1{font-size:1.05rem;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tright{margin-left:auto;display:flex;align-items:center;gap:10px}
.ib{width:40px;height:40px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2);color:var(--text);display:grid;place-items:center;font-size:.95rem;position:relative;transition:.18s}
.ib:hover{border-color:var(--acc);transform:translateY(-1px)}
.ib .bdg{position:absolute;top:-5px;right:-5px}
#menuBtn{display:none}
.role{font-size:.66rem;font-weight:800;letter-spacing:.9px;text-transform:uppercase;padding:6px 11px;border-radius:99px;background:rgba(201,206,216,.08);border:1px solid rgba(201,206,216,.28);color:var(--ti)}
.gsearch{position:relative;display:flex}.gsearch input{width:230px}
main{margin-left:var(--side);padding:calc(var(--top) + 22px) 26px 60px;min-height:100vh;position:relative}
.wrap{max-width:1400px;margin:0 auto;animation:pin .3s ease}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:960px){
  .side{transform:translateX(-100%)}.side.open{transform:none}
  .top{left:0;padding:0 14px}main{margin-left:0;padding:calc(var(--top) + 16px) 14px 70px}
  #menuBtn{display:grid}.gsearch{display:none}.role{display:none}
}

/* page chrome */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h2{font-size:1.5rem;font-weight:700;letter-spacing:-.3px}.ph p{color:var(--mute);font-size:.84rem;margin-top:3px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{position:relative;background:linear-gradient(180deg,rgba(26,26,31,.84),rgba(16,16,19,.84));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.ct{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.92rem;margin-bottom:14px;font-family:'Space Grotesk',sans-serif}
.ct i{color:var(--acc)}.ct small{color:var(--mute);font-weight:500;font-size:.74rem;margin-left:auto;font-family:Inter}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.gs{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}.gs{grid-template-columns:repeat(2,1fr)}}
.stat{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(28,28,33,.9),rgba(15,15,18,.9));border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:.22s;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.stat:hover{transform:translateY(-3px);border-color:rgba(255,122,26,.4);box-shadow:0 14px 30px -14px rgba(255,122,26,.25),inset 0 1px 0 rgba(255,255,255,.06)}
.stat::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--ti))}
.stat::before{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.12),transparent 70%);pointer-events:none}
.stat.pos::after{background:linear-gradient(90deg,var(--pos),#8af0c5)}.stat.neg::after{background:linear-gradient(90deg,var(--neg),#ff9aa5)}.stat.info::after{background:linear-gradient(90deg,var(--info),#9fd1ff)}.stat.vio::after{background:linear-gradient(90deg,var(--vio),#d8c2ff)}.stat.warn::after{background:linear-gradient(90deg,var(--warn),#ffe3a1)}
.sl{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:.68rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:9px}
.sl i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(201,206,216,.07);border:1px solid var(--line2);color:var(--acc2);font-size:.8rem}
.sv{font-size:1.45rem;font-weight:700;letter-spacing:-.4px;word-break:break-word}
.ss{font-size:.72rem;color:var(--dim);margin-top:4px}
.sv small{font-size:.7rem;color:var(--mute);font-weight:600}

/* hero */
.hero2{position:relative;overflow:hidden;border-radius:20px;padding:22px;margin-bottom:18px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,122,26,.12),rgba(22,22,26,.92) 45%,rgba(201,206,216,.07));box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.06)}
.hero2::after{content:'';position:absolute;right:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.18),transparent 70%);pointer-events:none}
.hero2 h2{font-size:1.4rem;font-weight:700}.hero2 p{color:var(--mute);font-size:.84rem;margin:3px 0 16px}
.hmet{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;position:relative;z-index:1}
.hm{background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:13px;padding:12px 14px}
.hm span{display:block;font-size:.62rem;letter-spacing:.9px;text-transform:uppercase;color:var(--mute);font-weight:700}
.hm b{display:block;font-size:1.15rem;margin-top:4px;font-family:'JetBrains Mono',monospace}
.hm em{font-style:normal;font-size:.68rem;color:var(--dim)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pos);margin-right:6px;box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pls 1.8s infinite}
@keyframes pls{70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}

/* forms */
label.l{display:block;font-size:.68rem;font-weight:700;color:var(--mute);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.inp,.sel,textarea.inp{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line2);border-radius:var(--rs);color:var(--text);font:inherit;font-size:.86rem;padding:11px 12px;outline:none;transition:.15s}
.inp:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,122,26,.14)}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.sel option{background:#121215}
textarea.inp{resize:vertical;min-height:80px}
.f{margin-bottom:13px}.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.hint{font-size:.72rem;color:var(--dim);margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--rs);padding:10px 16px;font-weight:700;font-size:.82rem;color:#1a0d02;background:linear-gradient(135deg,#FFB35C,var(--acc));box-shadow:0 8px 20px -8px rgba(255,122,26,.55),inset 0 1px 0 rgba(255,255,255,.3);transition:.16s;white-space:nowrap}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.btn.gh{background:var(--panel2);color:var(--text);border-color:var(--line);box-shadow:none}.btn.gh:hover{border-color:var(--acc)}
.btn.ok{background:linear-gradient(135deg,#59e8a8,#25b373);color:#04231a;box-shadow:0 8px 20px -8px rgba(61,220,151,.5)}
.btn.no{background:linear-gradient(135deg,#ff7b88,#e0384c);color:#fff;box-shadow:0 8px 20px -8px rgba(255,92,108,.5)}
.btn.wn,.btn.warn{background:linear-gradient(135deg,#ffd978,#f0a52a);color:#2a1800}
.btn.sm{padding:6px 11px;font-size:.74rem;border-radius:8px}.btn.bl{width:100%}
.sw{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:rgba(255,255,255,.12);border-radius:99px;transition:.2s;cursor:pointer}
.sw i::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:linear-gradient(135deg,var(--acc),#FFB35C)}.sw input:checked+i::before{transform:translateX(20px)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}.trow:last-child{border:none}
.trow b{font-size:.86rem;font-weight:700}.trow span.d{display:block;font-size:.72rem;color:var(--mute);font-weight:500;margin-top:2px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line2);border-radius:12px;background:rgba(0,0,0,.25)}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:.64rem;letter-spacing:.9px;text-transform:uppercase;color:var(--ti2);font-weight:800;padding:11px 12px;background:rgba(201,206,216,.04);border-bottom:1px solid var(--line2);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--acc2)}
td{padding:11px 12px;border-bottom:1px solid var(--line2);font-size:.82rem;vertical-align:middle}
tr:last-child td{border-bottom:none}tbody tr{transition:.12s}tbody tr:hover td{background:rgba(255,122,26,.05)}tr.clk{cursor:pointer}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tb .inp,.tb .sel{width:auto;min-width:150px}.tb .grow{flex:1;min-width:180px}
.pg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:.78rem;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:.66rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;border:1px solid}
.pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.pending,.pill.warn{color:var(--warn);background:rgba(255,200,87,.09);border-color:rgba(255,200,87,.28)}
.pill.ok,.pill.approved,.pill.completed,.pill.active,.pill.claimed,.pill.sent{color:var(--pos);background:rgba(61,220,151,.09);border-color:rgba(61,220,151,.28)}
.pill.bad,.pill.rejected,.pill.failed,.pill.banned,.pill.closed{color:var(--neg);background:rgba(255,92,108,.09);border-color:rgba(255,92,108,.28)}
.pill.processing,.pill.info,.pill.open{color:var(--info);background:rgba(90,176,255,.09);border-color:rgba(90,176,255,.28)}
.pill.mute{color:var(--mute);background:rgba(255,255,255,.05);border-color:var(--line2)}
.pill.gold{color:var(--ti);background:rgba(201,206,216,.07);border-color:rgba(201,206,216,.25)}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#E8EBF1,var(--acc));display:inline-grid;place-items:center;color:#1a0d02;font-weight:800;font-size:.8rem;flex-shrink:0}
.ur{display:flex;align-items:center;gap:10px;min-width:0}.ur b{display:block;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}.ur small{color:var(--dim);font-size:.7rem}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.mute{color:var(--mute)}.gold{color:var(--acc2)}.dim{color:var(--dim)}
.tiny{font-size:.72rem;color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line2);background:var(--panel2);color:var(--mute);border-radius:99px;padding:7px 14px;font-size:.76rem;font-weight:700;transition:.15s}
.chip:hover{border-color:rgba(255,122,26,.4);color:var(--text)}
.chip.on{background:linear-gradient(135deg,rgba(255,122,26,.24),rgba(201,206,216,.07));color:#fff;border-color:rgba(255,122,26,.5)}
.chip .cn{margin-left:6px;background:rgba(255,255,255,.1);border-radius:99px;padding:1px 7px;font-size:.66rem}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:.84rem}.kv:last-child{border:none}.kv span{color:var(--mute)}.kv b{text-align:right;word-break:break-word}
.empty{text-align:center;padding:34px 12px;color:var(--dim)}.empty i{font-size:1.8rem;margin-bottom:10px;display:block;color:rgba(201,206,216,.3)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(90,176,255,.07);border:1px solid rgba(90,176,255,.22);color:#b9dcff;font-size:.78rem;margin-bottom:14px}
.note.w{background:rgba(255,200,87,.07);border-color:rgba(255,200,87,.28);color:#ffe3a1}.note.b{background:rgba(255,92,108,.07);border-color:rgba(255,92,108,.28);color:#ffc0c7}
.note i{margin-top:2px}
pre.code{background:rgba(0,0,0,.55);border:1px solid var(--line2);border-radius:12px;padding:14px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:.72rem;line-height:1.55;max-height:420px;color:#ffd9b0;white-space:pre}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line2);margin-bottom:16px;padding-bottom:0}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--mute);padding:10px 14px;font-weight:700;font-size:.82rem;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--text)}
.tab.on{color:#fff;border-bottom-color:var(--acc)}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ti));border-radius:99px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}.li:last-child{border:none}
.li .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(201,206,216,.07);border:1px solid var(--line2);color:var(--acc2);flex-shrink:0}
.li .m{flex:1;min-width:0}.li .m b{display:block;font-size:.84rem}.li .m span{font-size:.72rem;color:var(--mute)}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--dim);font-size:10px;font-family:Inter}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.72rem;color:var(--mute)}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.msgs{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px;margin-bottom:12px}
.msg{max-width:84%;padding:9px 12px;border-radius:12px;font-size:.82rem;background:rgba(255,255,255,.06);align-self:flex-start;white-space:pre-wrap;word-break:break-word}.msg.a{align-self:flex-end;background:linear-gradient(135deg,rgba(255,122,26,.28),rgba(201,206,216,.1))}
.msg small{display:block;font-size:.64rem;color:var(--mute);margin-top:4px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-weight:700;font-size:.8rem;margin-bottom:14px;background:none;border:none}.back:hover{color:var(--acc2)}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.hero .av{width:64px;height:64px;font-size:1.4rem}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:620px){.kinds{grid-template-columns:1fr}}
.kind{text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:13px;color:var(--text);transition:.18s}
.kind:hover{border-color:rgba(255,122,26,.4);transform:translateY(-2px)}
.kind.on{border-color:var(--acc);background:linear-gradient(135deg,rgba(255,122,26,.16),rgba(201,206,216,.05));box-shadow:0 10px 24px -14px rgba(255,122,26,.5)}
.kind .e{font-size:1.5rem;display:block;margin-bottom:6px}.kind b{display:block;font-size:.84rem}.kind span{font-size:.7rem;color:var(--mute)}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex;animation:pin .18s ease}
.mbox{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#17171b,#101013);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.05)}
.mbox.wide{max-width:760px}
.mbox h3{font-size:1.05rem;margin-bottom:6px;display:flex;align-items:center;gap:10px}.mbox h3 i{color:var(--acc)}
.mbox .sub{color:var(--mute);font-size:.82rem;margin-bottom:16px}
.mbtn{display:flex;gap:10px;margin-top:16px}.mbtn .btn{flex:1}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);z-index:6000;background:#17171b;border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:13px;font-weight:600;font-size:.84rem;opacity:0;pointer-events:none;transition:.28s;max-width:92vw;box-shadow:var(--sh)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:rgba(61,220,151,.5)}#toast.er{border-color:rgba(255,92,108,.6)}
.sk{display:inline-block;min-width:60px;height:1em;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.13),rgba(255,255,255,.05));background-size:200% 100%;animation:shm 1.2s infinite;color:transparent}
@keyframes shm{to{background-position:-200% 0}}
.lock{opacity:.5;pointer-events:none}

/* ===== leaderboard rounds ===== */
.wrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--panel2);margin-bottom:8px}
.rk{min-width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;background:rgba(255,255,255,.06);color:var(--mute);flex-shrink:0}
.rk.r1,.rk.r2,.rk.r3{background:rgba(255,200,87,.12);font-size:1.1rem}

/* =====================================================================
   AURORA — new admin identity: deep ink + electric indigo × cyan, Sora / Manrope type,
   gradient pill buttons with shine, orbital loader. Design only — no logic changed.
===================================================================== */
:root{
  --bg:#05080F;--bg2:#090E1B;--panel:rgba(14,20,38,.80);--panel2:rgba(255,255,255,.04);--line:rgba(140,160,255,.14);--line2:rgba(255,255,255,.07);
  --text:#EEF2FF;--mute:#9BA7CB;--dim:#66729B;--acc:#7B61FF;--acc2:#2DD4FF;--gold:#FFB547;--ti:#C7D2FE;--ti2:#8693C2;
  --pos:#34E5A0;--neg:#FF5C7A;--warn:#FFC24D;--info:#4DA8FF;--vio:#B48CFF;
  --grad:linear-gradient(135deg,#7B61FF 0%,#2DD4FF 100%);--grad2:linear-gradient(135deg,#9B86FF 0%,#5B3FF0 100%);
  --r:18px;--rs:12px;--sh:0 26px 64px -22px rgba(0,0,0,.9);
}
body{font-family:'Manrope','Inter',system-ui,sans-serif;font-size:14px}
body::before{background:radial-gradient(900px 560px at 4% -10%,rgba(123,97,255,.20),transparent 60%),radial-gradient(760px 520px at 102% 0%,rgba(45,212,255,.11),transparent 60%),radial-gradient(700px 500px at 50% 112%,rgba(123,97,255,.09),transparent 60%)}
h1,h2,h3,.sv,.logo b,.ct{font-family:'Sora','Manrope',sans-serif}
.ct small{font-family:'Manrope'}
::-webkit-scrollbar-thumb:hover{background:rgba(123,97,255,.6)}
/* brand */
.logo i{color:#fff;background:var(--grad);box-shadow:0 10px 26px -6px rgba(123,97,255,.65),inset 0 1px 0 rgba(255,255,255,.45)}
.av{background:var(--grad);color:#fff}
/* sidebar */
.side{background:linear-gradient(180deg,rgba(10,15,30,.97),rgba(5,8,15,.99))}
.ni{border-radius:14px}
.ni:hover i{color:var(--acc2)}
.ni.on{background:linear-gradient(135deg,rgba(123,97,255,.22),rgba(45,212,255,.07));border-color:rgba(123,97,255,.38);box-shadow:0 10px 24px -14px rgba(123,97,255,.7),inset 0 1px 0 rgba(255,255,255,.06)}
.ni.on i{color:var(--acc2)}
.ni.on::before{background:var(--grad);box-shadow:0 0 12px rgba(45,212,255,.7)}
.bdg{background:linear-gradient(135deg,#FF7A93,#E0305A)}
.top{background:rgba(6,9,18,.82)}
.role{background:rgba(123,97,255,.12);border-color:rgba(123,97,255,.4);color:var(--ti)}
.ib{border-radius:14px}.ib:hover{border-color:var(--acc);box-shadow:0 8px 20px -10px var(--acc)}
/* cards */
.card{border-radius:var(--r);background:linear-gradient(180deg,rgba(24,32,58,.78),rgba(12,17,32,.82));border-color:var(--line)}
.ct i{background:rgba(123,97,255,.14);color:var(--acc2);width:28px;height:28px;border-radius:9px;display:inline-grid;place-items:center;font-size:.76rem}
.stat{border-radius:var(--r);background:linear-gradient(160deg,rgba(26,34,62,.9),rgba(11,16,31,.92))}
.stat:hover{border-color:rgba(123,97,255,.55);box-shadow:0 18px 36px -16px rgba(123,97,255,.5),inset 0 1px 0 rgba(255,255,255,.07)}
.stat::after{background:var(--grad);height:3px}
.stat::before{background:radial-gradient(circle,rgba(123,97,255,.20),transparent 70%)}
.sl i{color:var(--acc2);background:rgba(123,97,255,.12);border-radius:50%}
.hero2{border-radius:24px;background:radial-gradient(90% 120% at 100% 0%,rgba(45,212,255,.22),transparent 55%),radial-gradient(80% 100% at 0% 100%,rgba(123,97,255,.30),transparent 60%),linear-gradient(135deg,#17133F 0%,#0C1230 55%,#08102A 100%);border-color:rgba(150,160,255,.28);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.12)}
.hero2::after{background:radial-gradient(circle,rgba(45,212,255,.22),transparent 70%)}
.hm{border-radius:16px;background:rgba(5,8,20,.45);backdrop-filter:blur(10px)}
.hm b{color:#fff}
/* forms */
.inp,.sel,textarea.inp{border-radius:14px;background:rgba(2,5,14,.55);border-color:var(--line)}
.inp:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(123,97,255,.20),0 8px 24px -14px var(--acc)}
.sw input:checked+i{background:var(--grad)}
/* BUTTONS — gradient pill with moving shine */
.btn{position:relative;overflow:hidden;border-radius:14px;padding:11px 18px;font-weight:800;letter-spacing:.2px;color:#fff;background:var(--grad2);border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 26px -10px rgba(91,63,240,.8),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .18s,box-shadow .2s,filter .2s}
.btn::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);transition:none;pointer-events:none}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 30px -10px rgba(91,63,240,.95),inset 0 1px 0 rgba(255,255,255,.4);filter:brightness(1.07)}
.btn:hover:not(:disabled)::after{left:130%;transition:left .65s ease}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.gh{background:rgba(255,255,255,.05);color:var(--text);border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(8px)}
.btn.gh:hover:not(:disabled){border-color:var(--acc);box-shadow:0 10px 22px -12px var(--acc)}
.btn.ok{background:linear-gradient(135deg,#46F0B0,#0FA878);color:#022b1d;border-color:rgba(255,255,255,.25);box-shadow:0 12px 26px -10px rgba(20,200,140,.7),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.no{background:linear-gradient(135deg,#FF6F8E,#D4244E);color:#fff;box-shadow:0 12px 26px -10px rgba(255,70,110,.7),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.wn,.btn.warn{background:linear-gradient(135deg,#FFD97A,#F59E0B);color:#2b1700;box-shadow:0 12px 26px -10px rgba(245,158,11,.65),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.sm{border-radius:11px;padding:7px 12px}
.btn:disabled{opacity:.5}
/* busy state: any button that is "Working…" gets an animated stripe + spinner */
.btn:has(.fa-spin){background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.16) 0 12px,transparent 12px 24px);background-size:48px 100%;animation:stripe .9s linear infinite;opacity:1;cursor:progress}
@keyframes stripe{to{background-position:48px 0}}
/* tabs / chips / pills */
.tab.on{border-bottom-color:var(--acc2);color:#fff;text-shadow:0 0 18px rgba(45,212,255,.5)}
.chip:hover{border-color:rgba(123,97,255,.5)}
.chip.on{background:var(--grad2);color:#fff;border-color:transparent;box-shadow:0 10px 22px -10px rgba(91,63,240,.9)}
.kind:hover{border-color:rgba(123,97,255,.5)}
.kind.on{border-color:var(--acc);background:linear-gradient(135deg,rgba(123,97,255,.20),rgba(45,212,255,.06));box-shadow:0 12px 26px -14px rgba(123,97,255,.8)}
.bar b{background:var(--grad)}
/* tables */
th{color:var(--ti2);background:rgba(123,97,255,.07)}
tbody tr:hover td{background:rgba(123,97,255,.07)}
.li .ic{background:rgba(123,97,255,.12);color:var(--acc2);border-radius:50%}
.pill.gold{color:var(--ti);background:rgba(123,97,255,.12);border-color:rgba(123,97,255,.35)}
.msg.a{background:linear-gradient(135deg,rgba(123,97,255,.32),rgba(45,212,255,.12))}
pre.code{color:#CFE3FF}
a{color:var(--acc2)}
/* modal / toast */
.mbox{border-radius:24px;background:linear-gradient(180deg,#141a35,#0b1022);border-color:rgba(150,160,255,.22)}
#toast{border-radius:16px;background:rgba(12,17,34,.96);backdrop-filter:blur(14px)}
#toast.ok{border-color:rgba(52,229,160,.6)}
/* login: animated aurora backdrop */
.gate::before,.gate::after{content:'';position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
.gate::before{width:420px;height:420px;left:-120px;top:-100px;background:#5B3FF0;animation:blobA 14s ease-in-out infinite alternate}
.gate::after{width:360px;height:360px;right:-100px;bottom:-90px;background:#0FA9D6;animation:blobB 16s ease-in-out infinite alternate}
@keyframes blobA{to{transform:translate(90px,70px) scale(1.15)}}@keyframes blobB{to{transform:translate(-80px,-60px) scale(1.2)}}
.gbox{border-radius:26px;background:linear-gradient(180deg,rgba(24,30,58,.88),rgba(9,13,28,.92));border-color:rgba(150,160,255,.24)}
/* LOADER — orbital rings + shimmer progress */
#boot{background:radial-gradient(600px 420px at 50% 40%,rgba(123,97,255,.20),transparent 65%),var(--bg);overflow:hidden}
.ldr{display:flex;flex-direction:column;align-items:center;gap:6px;animation:ldrIn .6s cubic-bezier(.2,.8,.3,1) both}
@keyframes ldrIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.ldr-orbit{position:relative;width:128px;height:128px;display:grid;place-items:center;margin-bottom:18px}
.ldr-orbit span{position:absolute;border-radius:50%;border:2px solid transparent}
.ldr-orbit span:nth-child(1){inset:0;border-top-color:#7B61FF;border-right-color:rgba(123,97,255,.25);animation:sp 1.2s linear infinite}
.ldr-orbit span:nth-child(2){inset:14px;border-bottom-color:#2DD4FF;border-left-color:rgba(45,212,255,.25);animation:sp 1.8s linear infinite reverse}
.ldr-orbit span:nth-child(3){inset:28px;border-top-color:#FFB547;border-right-color:rgba(255,181,71,.2);animation:sp 2.6s linear infinite}
.ldr-orbit i{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:1.15rem;color:#fff;background:var(--grad);box-shadow:0 0 34px rgba(123,97,255,.75);animation:pls2 1.8s ease-in-out infinite}
@keyframes pls2{50%{transform:scale(1.1);box-shadow:0 0 46px rgba(45,212,255,.85)}}
.ldr-t{font-family:'Sora',sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ldr-s{font-size:.66rem;letter-spacing:3px;text-transform:uppercase;color:var(--ti2);font-weight:700}
.ldr-bar{width:190px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:16px}
.ldr-bar b{display:block;width:45%;height:100%;border-radius:99px;background:var(--grad);animation:ldrBar 1.3s ease-in-out infinite}
@keyframes ldrBar{0%{transform:translateX(-110%)}100%{transform:translateX(250%)}}
.ldr-m{font-size:.72rem;color:var(--dim);margin-top:8px;animation:ldrM 2s ease-in-out infinite}
@keyframes ldrM{50%{opacity:.4}}
.spin{border-color:rgba(123,97,255,.18);border-top-color:var(--acc2);border-right-color:var(--acc)}
.empty .fa-spin,.fa-circle-notch.fa-spin{color:var(--acc2)}
.sk{background:linear-gradient(90deg,rgba(123,97,255,.06),rgba(45,212,255,.16),rgba(123,97,255,.06));background-size:200% 100%}
@media (prefers-reduced-motion:reduce){.gate::before,.gate::after,.ldr-bar b,.ldr-orbit span{animation-duration:.01ms!important}}

/* ===== NEXA ADMIN LAYER — one premium skin for every page ===== */
:root{--bg:#080B14;--bg2:#0C1120;--acc:#795BFF;--acc2:#20C9D7;--gold:#F0B90B}
@keyframes nxShine{0%{transform:translateX(-130%) skewX(-18deg)}60%,100%{transform:translateX(260%) skewX(-18deg)}}
@keyframes nxRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes nxPulse{0%,100%{box-shadow:0 0 0 0 rgba(121,91,255,.5)}50%{box-shadow:0 0 0 7px rgba(121,91,255,0)}}
.wrap>*{animation:nxRise .4s cubic-bezier(.2,.8,.3,1) both}.wrap>*:nth-child(2){animation-delay:.04s}.wrap>*:nth-child(3){animation-delay:.08s}.wrap>*:nth-child(4){animation-delay:.12s}
/* page header: accent bar + gradient title */
.ph{position:relative;padding:4px 0 14px 18px;border-bottom:1px solid var(--line2)}
.ph::before{content:"";position:absolute;left:0;top:6px;bottom:16px;width:5px;border-radius:5px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.ph h2{background:linear-gradient(90deg,#fff 30%,var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* cards: gradient hairline border */
.card{border:1px solid transparent;background:linear-gradient(180deg,rgba(24,32,62,.82),rgba(11,16,32,.86)) padding-box,linear-gradient(140deg,rgba(255,255,255,.20),rgba(255,255,255,.04) 38%,var(--acc) 150%) border-box}
.ct{display:flex;align-items:center;gap:10px;font-weight:800}
.ct>i:first-child{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:var(--grad2);color:#fff;font-size:.8rem;box-shadow:0 8px 18px -8px var(--acc)}
/* stat tiles: gradient numbers, glowing icon chip, shine on hover */
.stat{overflow:hidden}
.stat .sv{background:linear-gradient(180deg,#fff,#C9D2FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat.pos .sv{background:linear-gradient(180deg,#fff,#7DF2C0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat.neg .sv{background:linear-gradient(180deg,#fff,#FF9AAE);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat.warn .sv{background:linear-gradient(180deg,#FFF3C4,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .sv small{-webkit-text-fill-color:var(--mute)}
.stat:hover::before{opacity:1;transform:scale(1.4)}
/* buttons */
.btn{position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s,filter .2s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn:not(.gh):not(.ok):not(.no):not(.wn):not(:disabled)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:nxShine 6s ease-in-out infinite}
/* tables: header band, row hover glow, zebra */
table thead th{background:linear-gradient(180deg,rgba(121,91,255,.16),rgba(121,91,255,.04));color:var(--ti);letter-spacing:.06em}
table tbody tr{transition:background .15s}table tbody tr:hover{background:linear-gradient(90deg,rgba(121,91,255,.14),rgba(32,201,215,.05))}
table tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
/* inputs / tabs / pills */
.inp,select.sel,textarea.inp{background:rgba(8,11,20,.7);border:1px solid var(--line);border-radius:13px;transition:border-color .2s,box-shadow .2s}
.inp:focus,select.sel:focus{border-color:var(--acc2);box-shadow:0 0 0 4px rgba(32,201,215,.14);outline:0}
.tab.on{background:var(--grad2);box-shadow:0 10px 22px -10px var(--acc)}
.pill{font-weight:800;letter-spacing:.03em}
/* sidebar: active item glow, group labels with line */
.nav a.on,.nav .ni.on,.nav button.on{background:linear-gradient(90deg,rgba(121,91,255,.28),rgba(32,201,215,.08));border:1px solid rgba(121,91,255,.5);box-shadow:0 10px 24px -14px var(--acc)}
.nav .sec,.nav-sec{display:flex;align-items:center;gap:8px}
.nav .sec::after,.nav-sec::after{content:"";flex:1;height:1px;background:var(--line2)}
.note{border-radius:14px;background:linear-gradient(90deg,rgba(32,201,215,.10),rgba(121,91,255,.06));border:1px solid rgba(32,201,215,.28)}
.tiny{opacity:.9}
/* skeleton + empty */
.empty i,.empty .fa-solid,.empty .fas{width:64px;height:64px;line-height:64px;border-radius:50%;background:rgba(121,91,255,.16);color:var(--acc2);display:inline-block}
@media(max-width:720px){.ph{padding-left:14px}.ph h2{font-size:1.25rem}.stat .sv{font-size:1.2rem}.card{padding:14px}.btn{padding:10px 14px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ===== NEXA GOLD EXCHANGE — admin (default). Switch back to Violet with the palette button ===== */
html[data-theme="gold"]{--bg:#090B10;--bg2:#0E1118;--panel:rgba(20,24,33,.86);--line:rgba(255,226,138,.12);--line2:rgba(255,226,138,.07);
  --text:#F6F7FA;--mute:#A3ABBB;--dim:#6C7487;--acc:#F0B90B;--acc2:#FFD966;--ti:#FFE9A8;--ti2:#B8A36A;--vio:#F0B90B;
  --grad:linear-gradient(135deg,#FFF0B8 0%,#F0B90B 55%,#B98100 100%);--grad2:linear-gradient(135deg,#FBE08A 0%,#F0B90B 50%,#C48A00 100%);--onacc:#1A1300}
html[data-theme="violet"]{--onacc:#fff}
html[data-theme="gold"] body::before{background:radial-gradient(900px 560px at 4% -10%,rgba(240,185,11,.16),transparent 60%),radial-gradient(760px 520px at 102% 0%,rgba(32,201,215,.08),transparent 60%)}
html[data-theme="gold"]::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(255,226,138,.09) 1px,transparent 1.4px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse 80% 45% at 50% 0%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 80% 45% at 50% 0%,#000 10%,transparent 75%)}
html[data-theme="gold"] .side{background:linear-gradient(180deg,rgba(14,16,22,.98),rgba(8,10,14,.99))}
html[data-theme="gold"] .top{background:rgba(9,11,16,.84)}

/* token hero */
.tk-hero{position:relative;display:grid;grid-template-columns:1.1fr 1fr;gap:22px;padding:24px;margin-bottom:20px;border-radius:28px;border:1px solid rgba(206,220,250,.30);background:radial-gradient(120% 100% at 92% -20%,rgba(110,160,255,.32),transparent 60%),radial-gradient(80% 80% at 0% 120%,rgba(245,196,81,.12),transparent 60%),linear-gradient(160deg,#1A2B58,#0E1836 60%,#0A1228);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 28px 50px -26px rgba(30,80,200,.6);overflow:hidden}
.tkh-orbit{position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(206,220,250,.2);box-shadow:0 0 0 28px rgba(255,255,255,.016),0 0 0 58px rgba(255,255,255,.01);animation:nxOrbit 30s linear infinite;pointer-events:none}
@keyframes nxOrbit{to{transform:rotate(360deg)}}
.tkh-l,.tkh-r{position:relative;z-index:1}
.tkh-coin{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tkh-logo{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:1.3rem;color:#04122E;background:linear-gradient(135deg,#FFE9A8,#F5C451 55%,#C48A00);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px rgba(214,224,245,.8),0 10px 22px -6px rgba(245,196,81,.6)}
.tkh-coin b{display:block;font-size:1.15rem;font-weight:800}.tkh-coin em{font-style:normal;display:inline-block;margin-top:3px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:.68rem;font-weight:800;letter-spacing:.06em;color:#9CC4FF}
.tkh-pill{margin-left:auto;padding:7px 13px;border-radius:99px;font-weight:800;font-size:.82rem}.tkh-pill.up{background:rgba(47,214,163,.15);color:#2FD6A3}.tkh-pill.dn{background:rgba(255,100,120,.16);color:#FF6478}
.tkh-price{font-family:'Sora',sans-serif;font-size:3.1rem;font-weight:800;margin:18px 0 12px;letter-spacing:-.04em;line-height:1;background:linear-gradient(180deg,#fff,#D5E4FF 55%,#8DB9FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums;filter:drop-shadow(0 6px 22px rgba(61,139,255,.4))}
.tkh-price small{font-size:1rem;-webkit-text-fill-color:var(--mute)}
.tkh-chips{display:flex;gap:8px;flex-wrap:wrap}
.tkh-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;font-size:.78rem;font-weight:800;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mute)}
.tkh-chip i{width:7px;height:7px;border-radius:50%;background:#FF6478;box-shadow:0 0 8px #FF6478}.tkh-chip.on{color:#fff;border-color:rgba(47,214,163,.4);background:rgba(47,214,163,.1)}.tkh-chip.on i{background:#2FD6A3;box-shadow:0 0 8px #2FD6A3}
.tkh-r svg{width:100%;height:84px;display:block;filter:drop-shadow(0 6px 10px rgba(61,139,255,.5))}
.tkh-st{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.tkh-st div{padding:11px 12px;border-radius:16px;background:rgba(5,10,28,.55);border:1px solid var(--line)}
.tkh-st span{display:block;font-size:.6rem;font-weight:800;letter-spacing:.1em;color:var(--mute)}.tkh-st b{display:block;margin-top:5px;font-size:.92rem;font-variant-numeric:tabular-nums}
@media(max-width:860px){.tk-hero{grid-template-columns:1fr;padding:18px}.tkh-price{font-size:2.5rem}.tkh-st{grid-template-columns:repeat(3,1fr)}}

<script>

const firebaseConfig = {

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { v = Number(v); return isFinite(v) ? v : 0; };

const fdate = ts => ts ? new Date(ts).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const rid = (n = 5) => Math.random().toString(36).slice(2, 2 + n).toUpperCase();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const dkey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const arr = o => o ? Object.keys(o).map(k => ({ ...o[k], _k: k })) : [];
const sym = () => (S.cfg && S.cfg.currencySymbol) || 'TK';
const tsym = () => (S.cfg.token && S.cfg.token.symbol) || 'TOKEN';
const tprice = () => num(S.cfg.token && S.cfg.token.price);
const initial = n => (String(n || '?').trim()[0] || '?').toUpperCase();

const empty = (ic, msg) => '<div class="empty"><i class="fas ' + ic + '"></i>' + esc(msg) + '</div>';
const attr = s => esc(s);

/* ---------------- state ---------------- */
const S = {
  cfg: {}, users: {}, wd: {}, dep: {}, tokTx: {}, tokStats: {}, tickets: {}, activeTasks: {}, promo: {}, methods: {}, ann: {}, audit: [],
  ledger: null, ledgerAt: 0, devices: null, loginLog: [], admins: null,
  admin: null, role: null, uid: null, email: null, page: 'dashboard', params: {}, loaded: {}, dirty: false, sessionStart: Date.now()
};
const ROLE_PERMS = {
  super: ['users', 'money', 'tokens', 'content', 'support', 'settings', 'security'],
  admin: ['users', 'money', 'tokens', 'content', 'support', 'settings'],
  finance: ['money'],
  support: ['support', 'content'],
  viewer: []
};
const can = p => (ROLE_PERMS[S.role] || []).includes(p);
function need(p) { if (can(p)) return true; toast('Permission denied for your role (' + (S.role || 'none') + ')', 'er'); return false; }

/* ---------------- toast / modal ---------------- */
let _tt = null;
function toast(msg, kind) { const el = $('toast'); el.textContent = msg; el.className = 'show ' + (kind || ''); clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 3400); }
function openModal(html, wide) { $('mbox').className = 'mbox' + (wide ? ' wide' : ''); $('mbox').innerHTML = html; $('modal').classList.add('show'); }
function closeModal() { $('modal').classList.remove('show'); $('mbox').innerHTML = ''; }
$('modal').addEventListener('mousedown', e => { if (e.target === $('modal')) closeModal(); });

let _confirmFn = null;
function confirmBox(o) {
  _confirmFn = o.onOk;
  openModal('<h3><i class="fas ' + (o.icon || 'fa-circle-question') + '"></i>' + esc(o.title) + '</h3><div class="sub">' + (o.msg || '') + '</div>' +
    (o.typed ? '<div class="f"><label class="l">Type <b class="gold">CONFIRM</b> to continue</label><input class="inp" id="cfTyped" autocomplete="off" placeholder="CONFIRM"></div>' : '') +
    '<div class="mbtn"><button class="btn gh" data-act="closeModal">Cancel</button><button class="btn ' + (o.cls || '') + '" id="cfOk" data-act="confirmOk"><i class="fas ' + (o.okIcon || 'fa-check') + '"></i> ' + esc(o.label || 'Confirm') + '</button></div>');
  if (o.typed) { $('cfOk').disabled = true; $('cfTyped').addEventListener('input', e => { $('cfOk').disabled = e.target.value.trim().toUpperCase() !== 'CONFIRM'; }); }
}
async function runBtn(btn, fn) {
  if (btn) { btn.disabled = true; btn._h = btn.innerHTML; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Working…'; }
  try { return await fn(); }
  catch (e) { console.error(e); toast((e && e.message) || 'Action failed', 'er'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = btn._h; } }
}
/* generic form modal: fields [{id,label,type,value,options,ph,hint,req,min,step,rows}] */
let _formDef = null;
function formModal(def) {
  _formDef = def;
  const f = def.fields.map(x => {
    const id = 'fm_' + x.id, v = x.value == null ? '' : x.value;
    let inner;
    if (x.type === 'select') inner = '<select class="sel" id="' + id + '">' + x.options.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return '<option value="' + attr(ov) + '"' + (String(ov) === String(v) ? ' selected' : '') + '>' + esc(ol) + '</option>'; }).join('') + '</select>';
    else if (x.type === 'textarea') inner = '<textarea class="inp" id="' + id + '" rows="' + (x.rows || 4) + '" placeholder="' + attr(x.ph || '') + '">' + esc(v) + '</textarea>';
    else if (x.type === 'switch') return '<div class="trow"><b>' + esc(x.label) + (x.hint ? '<span class="d">' + esc(x.hint) + '</span>' : '') + '</b><label class="sw"><input type="checkbox" id="' + id + '"' + (v ? ' checked' : '') + '><i></i></label></div>';
    else inner = '<input class="inp" id="' + id + '" type="' + (x.type || 'text') + '" value="' + attr(v) + '" placeholder="' + attr(x.ph || '') + '"' + (x.min != null ? ' min="' + x.min + '"' : '') + (x.step ? ' step="' + x.step + '"' : '') + '>';
    return '<div class="f"><label class="l">' + esc(x.label) + (x.req ? ' *' : '') + '</label>' + inner + (x.hint ? '<div class="hint">' + esc(x.hint) + '</div>' : '') + '</div>';
  }).join('');
  openModal('<h3><i class="fas ' + (def.icon || 'fa-pen') + '"></i>' + esc(def.title) + '</h3>' + (def.sub ? '<div class="sub">' + def.sub + '</div>' : '') + f +
    '<div class="mbtn"><button class="btn gh" data-act="closeModal">Cancel</button><button class="btn ' + (def.cls || '') + '" id="fmOk" data-act="formOk">' + esc(def.submit || 'Save') + '</button></div>', def.wide);
}
function formVals() {
  const v = {};
  for (const x of _formDef.fields) { const el = $('fm_' + x.id); v[x.id] = x.type === 'switch' ? el.checked : (x.type === 'number' ? el.value : el.value.trim()); }
  return v;
}

/* ---------------- delegated events ---------------- */
const ACT = {}, INP = {}, CHG = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && INP[el.dataset.in]) INP[el.dataset.in](el.value, el, el.dataset); });
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && CHG[el.dataset.ch]) CHG[el.dataset.ch](el.type === 'checkbox' ? el.checked : el.value, el, el.dataset); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'lgPass' || e.target.id === 'lgEmail')) ACT.login({}, $('lgBtn')); if (e.key === 'Escape') closeModal(); });
ACT.closeModal = closeModal;
ACT.confirmOk = (d, el) => runBtn(el, async () => { const f = _confirmFn; closeModal(); if (f) await f(); });
ACT.formOk = (d, el) => runBtn(el, async () => {
  const v = formVals();
  for (const x of _formDef.fields) if (x.req && !String(v[x.id]).trim()) { toast(x.label + ' is required', 'er'); return; }
  const r = await _formDef.onSubmit(v); if (r !== false) closeModal();
});
ACT.openNav = () => { $('side').classList.add('open'); $('scrim').classList.add('show'); };
ACT.closeNav = () => { $('side').classList.remove('open'); $('scrim').classList.remove('show'); };

/* ---------------- tables (search / sort / paginate / csv) ---------------- */
const T = {};
function tbl(id, cols, rows, o) {
  o = o || {}; const st = T[id] = Object.assign({ q: '', page: 0, sort: null, dir: 1 }, T[id] && T[id].keep ? T[id] : {}, { cols, rows, o, keep: true });
  const bar = (o.search !== false ? '<input class="inp grow" placeholder="' + attr(o.ph || 'Search…') + '" value="' + attr(st.q) + '" data-in="tq" data-id="' + id + '">' : '') + (o.bar || '') + (o.csv ? '<button class="btn gh sm" data-act="tcsv" data-id="' + id + '"><i class="fas fa-download"></i> CSV</button>' : '');
  return '<div class="tb">' + bar + '</div><div id="tb_' + id + '">' + tblBody(id) + '</div>';
}
function tblRows(id) {
  const st = T[id], o = st.o; let r = st.rows;
  if (st.q && o.hay) { const q = st.q.toLowerCase(); r = r.filter(x => String(o.hay(x)).toLowerCase().includes(q)); }
  if (st.sort != null) { const c = st.cols[st.sort]; if (c && c.v) r = r.slice().sort((a, b) => { const x = c.v(a), y = c.v(b); return (x > y ? 1 : x < y ? -1 : 0) * st.dir; }); }
  return r;
}
function tblBody(id) {
  const st = T[id], o = st.o, r = tblRows(id), ps = o.size || 25, pages = Math.max(1, Math.ceil(r.length / ps));
  if (st.page >= pages) st.page = pages - 1;
  const slice = r.slice(st.page * ps, st.page * ps + ps);
  if (!r.length) return empty(o.icon || 'fa-inbox', o.empty || 'No records');
  return '<div class="tw"><table><thead><tr>' + st.cols.map((c, i) => '<th' + (c.v ? ' class="s" data-act="tsort" data-id="' + id + '" data-i="' + i + '"' : '') + (c.right ? ' style="text-align:right"' : '') + '>' + esc(c.h) + (st.sort === i ? (st.dir > 0 ? ' ▲' : ' ▼') : '') + '</th>').join('') + '</tr></thead><tbody>' +
    slice.map(x => '<tr' + (o.row ? ' class="clk" data-act="' + o.row + '" data-id="' + attr(o.rowId ? o.rowId(x) : '') + '"' : '') + '>' + st.cols.map(c => '<td' + (c.right ? ' style="text-align:right"' : '') + '>' + c.f(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>' +
    '<div class="pg"><span>' + fint(r.length) + ' record' + (r.length === 1 ? '' : 's') + '</span><span style="display:flex;gap:8px;align-items:center"><button class="btn gh sm" data-act="tpg" data-id="' + id + '" data-d="-1"' + (st.page === 0 ? ' disabled' : '') + '><i class="fas fa-chevron-left"></i></button> ' + (st.page + 1) + ' / ' + pages + ' <button class="btn gh sm" data-act="tpg" data-id="' + id + '" data-d="1"' + (st.page >= pages - 1 ? ' disabled' : '') + '><i class="fas fa-chevron-right"></i></button></span></div>';
}

    const ab = appBtn(); if (ab) body.reply_markup = { inline_keyboard: [[ab]] };
    return post('sendMessage', body);
  }
  const srv = () => nc().serverMode === true && nc().serverReady === true;
  /* the button under every Telegram message — configurable in Notification Center → Footer & app name */
  const appBtn = () => {
    const n = nc(); if (n.button === false) return null;
    const u = String(n.miniAppUrl || '').trim(), t = String(n.buttonText || '').trim() || ('🚀 ' + app());
    if (u) { if (n.buttonType === 'webapp' && /^https:\/\//i.test(u)) return { text: t, web_app: { url: u } }; if (/^(https?:\/\/|tg:\/\/)/i.test(u)) return { text: t, url: u }; }
    const bu = String(cfg().botUsername || '').trim();
    return /^@?[A-Za-z][A-Za-z0-9_]{3,}$/.test(bu) ? { text: t, url: 'https://t.me/' + bu.replace(/^@/, '') + '/app' } : null;
  };
  const stOf = res => res.ok ? 'sent' : (res.skip ? 'skipped' : (res.unavail ? 'unavailable' : (res.retryable ? 'retry_pending' : 'failed')));
  const HINT = 'User has not started the bot yet — ask them to open the bot and press Start. In-app notification is kept.';
  async function deliver(target, eid, r, ts) {
    const base = 'notifDelivery/' + target + '/' + eid, rec = 'userNotifications/' + target + '/' + eid + '/tg';
    try { await db.ref(base + '/lock').set(Date.now()); } catch (e) {}
    if (srv()) {
      await db.ref('notifOutbox/' + target + '/' + eid).set({ kind: r.kind, ts, status: 'queued', attempts: 0 });
      await db.ref(base).set({ kind: r.kind, status: 'queued', channel: 'server', ts, attempts: 0 });
      return 'queued';
    }
    const res = await raw(target, tgText(r, ts)), st = stOf(res);
    await db.ref(base).set({ kind: r.kind, status: st, channel: 'client', ts, at: Date.now(), attempts: res.skip ? 0 : 1, error: res.ok ? null : String(res.err || '').slice(0, 200), hint: res.unavail ? HINT : null });
    await db.ref(rec).set(st);
    await failIdx(target, eid, r.kind, st, res.err);
    return st;
  }
  /* flat index of failed deliveries (admin "Delivery log" + server retry) */
  async function failIdx(target, eid, kind, st, err) {
    try { const k = 'notifFailures/' + target + '__' + eid; if (st === 'failed' || st === 'retry_pending' || st === 'unavailable') await db.ref(k).set({ uid: target, eid, kind, st, err: String(err || '').slice(0, 200), hint: st === 'unavailable' ? HINT : null, ts: Date.now() }); else if (st === 'sent') await db.ref(k).remove(); } catch (e) {}
  }
  /* Core: idempotent create-only write, then Telegram — only by whoever committed the write. */
  async function send(target, kind, eid, d, o) {
    o = o || {};
    try {
      target = String(target || host.selfUid() || ''); if (!target || !on(kind)) return false;
      const isSelf = target === String(host.selfUid() || '');
      let st = o.settings || (isSelf ? host.selfSettings() : null);
      if (!st && !isSelf && !o.noPrefs) { try { st = (await db.ref('users/' + target + '/settings').once('value')).val() || {}; } catch (e) { st = {}; } }
      const lang = o.lang || (st && st.lang) || (isSelf && host.lang()) || nc().defaultLang || 'en';
      const r = build(kind, d, lang); try { const un = (typeof uOf === 'function' && uOf(target)) || null; if (un && un.name) r.name = String(un.name).slice(0, 60); } catch (e) {}
      if (!o.force && st && st.notif && st.notif[r.cat] === false) return false;
      eid = clean(eid || newId());
      const ts = Date.now(), rec = Object.assign({}, r, { eid, ts, read: false, tg: 'pending' }, o.extra || {});
      const tx = await db.ref('userNotifications/' + target + '/' + eid).transaction(c => c ? undefined : rec);
      if (!tx.committed) return false;
      deliver(target, eid, r, ts).catch(e => { console.warn('[NT] delivery error', kind, target, e); try { db.ref('notifFailures/' + target + '__' + eid).set({ uid: target, eid, kind, st: 'failed', err: 'internal: ' + String((e && e.message) || e).slice(0, 160), ts: Date.now() }); } catch (x) {} });
      return true;
    } catch (e) { return false; }
  }
  /* Safe retry of a failed Telegram delivery (lock via transaction so a double click sends once). */
  async function retry(target, eid) {
    try {
      const ref = db.ref('notifDelivery/' + target + '/' + eid);
      const lock = await ref.child('status').transaction(c => (c === 'failed' || c === 'skipped' || c === 'retry_pending' || c === 'unavailable') ? 'retrying' : undefined);
      if (!lock.committed) return false;
      const rec = (await db.ref('userNotifications/' + target + '/' + eid).once('value')).val();
      if (!rec) { await ref.child('status').set('failed'); return false; }
      const res = await raw(target, tgText(rec, rec.ts)), at = ((await ref.child('attempts').once('value')).val() || 0) + 1;
      const st = stOf(res);
      await ref.update({ status: st, attempts: at, at: Date.now(), error: res.ok ? null : String(res.err || '').slice(0, 200), hint: res.unavail ? HINT : null });
      await db.ref('userNotifications/' + target + '/' + eid + '/tg').set(st);
      await failIdx(target, eid, rec.kind, st, res.err);
      return res.ok;
    } catch (e) { return false; }
  }
  /* Fan-out to many users with the SAME event id (re-running never duplicates). */
  async function broadcast(kind, eid, d, targets, o) {
    o = o || {}; const list = targets.slice(), stats = { sent: 0, skipped: 0 }; eid = clean(eid || newId());
    const worker = async () => { while (list.length) { const t = list.shift(); const ok = await send(t.uid, kind, eid, d, Object.assign({}, o, { settings: t.settings })); ok ? stats.sent++ : stats.skipped++; if (!srv()) await new Promise(r => setTimeout(r, 40)); } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    return stats;
  }
  return { T, build, tgText, send, retry, broadcast, on, footer, app, host, clean, newId, raw, post, srv, failIdx, appBtn, stOf, when, STL };
})();

const NT_LAST = {};

<script>
/* =====================================================================
   TELEGRAM RELAY — pushes every in-app notification created by the Mini App
   (deposit/withdrawal/token-withdrawal submitted, task done, referral…) to the
   user's Telegram chat if the Mini App itself did not manage to deliver it.
   • does not touch the in-app records or the Mini App
   • one create-only lock per notification (notifDelivery/<uid>/<eid>/lock) => no duplicates
   • works while the Admin Console is open; the Cloud Function (functions/index.js) does the same 24/7
   ===================================================================== */
const RELAY = { att: {}, seen: {} };
function relayAttach() {
  if (!S.uid || !S.booted || !botToken() || nfg().relay === false) return;
  Object.values(S.users).filter(u => !isBanned(u) && Date.now() - lastActiveTs(u) < 24 * 3600e3).sort((a, b) => lastActiveTs(b) - lastActiveTs(a)).slice(0, 60).forEach(u => {
    const uid = String(u.id); if (RELAY.att[uid]) return; RELAY.att[uid] = true;
    db.ref('userNotifications/' + uid).limitToLast(8).on('child_added', s => relayConsider(uid, s.key, s.val()), e => console.warn('[relay]', uid, e && e.code));
  });
}
function relayConsider(uid, eid, v) {
  const k = uid + '/' + eid; if (!v || RELAY.seen[k]) return; RELAY.seen[k] = 1;
  const ts = num(v.ts); if (!ts || Date.now() - ts > 30 * 60000) return;
  if (v.tg === 'sent' || v.tg === 'unavailable') return;
  setTimeout(() => relayRun(uid, eid), Math.max(1500, 12000 - (Date.now() - ts)));
}
async function relayRun(uid, eid) {
  try {
    const cur = (await db.ref('userNotifications/' + uid + '/' + eid).once('value')).val(); if (!cur || cur.tg === 'sent' || cur.tg === 'unavailable') return;
    const lk = await db.ref('notifDelivery/' + uid + '/' + eid + '/lock').transaction(c => c ? undefined : Date.now()); if (!lk.committed) return;
    const u = uOf(uid) || {}, lang = (u.settings && u.settings.lang) || nfg().defaultLang || 'en';
    const r = Array.isArray(cur.fields) ? Object.assign({}, cur) : NT.build('generic', { cat: cur.cat, title: cur.title, body: cur.body, emoji: cur.emoji }, lang);
    r.name = u.name || '';
    const res = await NT.raw(uid, NT.tgText(r, cur.ts)), st = NT.stOf(res);
    await db.ref('notifDelivery/' + uid + '/' + eid).update({ kind: cur.kind || r.kind || 'legacy', status: st, channel: 'relay', ts: cur.ts, at: Date.now(), attempts: 1, error: res.ok ? null : String(res.err || '').slice(0, 200), hint: res.unavail ? 'User has not started the bot yet — ask them to open the bot and press Start. In-app notification is kept.' : null });
    if (cur.tg !== undefined) await db.ref('userNotifications/' + uid + '/' + eid + '/tg').set(st);
    await NT.failIdx(uid, eid, cur.kind || r.kind || 'legacy', st, res.err);
  } catch (e) { console.warn('[relay] failed', uid, eid, e); }
}
setInterval(relayAttach, 45000); setTimeout(relayAttach, 6000);

  ACT.mxSkFill = () => { for (let n = 2; n <= 30; n++) { if ($('sk_m' + n).value === '' && $('sk_k' + n).value === '') { $('sk_t' + n).value = $('sk_t1').value; $('sk_m' + n).value = $('sk_m1').value; $('sk_k' + n).value = $('sk_k1').value; } } toast('Filled — press Save', 'ok'); };
  ACT.mxSkSave = (d, el) => runBtn(el, async () => {
    const days = {}; for (let n = 1; n <= 30; n++) { const m = Number(val('sk_m' + n) || 0), k = Number(val('sk_k' + n) || 0), t = val('sk_t' + n); if (m < 0 || k < 0 || !isFinite(m) || !isFinite(k)) return toast('Day ' + n + ': invalid amount', 'er'); if ((t === 'main' || t === 'both') && !(m > 0) && (t === 'main' || !(k > 0))) return toast('Day ' + n + ': set an amount for the chosen type', 'er'); if ((t === 'token' || t === 'both') && !(k > 0) && (t === 'token' || !(m > 0))) return toast('Day ' + n + ': set an amount for the chosen type', 'er'); days[n] = { type: t, main: m, token: k }; }
    const f = nv('sk_f'), t = nv('sk_t'); if (!(f >= 0 && t <= 24 && f < t)) return toast('Claim window must satisfy 0 ≤ open < close ≤ 24', 'er');
    await saveCfg({ streak: { enabled: chk('sk_on'), tzOffsetMin: nv('sk_tz'), graceDays: Math.max(0, Math.floor(nv('sk_gr'))), claimFromHour: f, claimToHour: t, resetOnMiss: chk('sk_rs'), repeat: chk('sk_rp'), completion: { type: val('sk_ct'), main: nv('sk_cm'), token: nv('sk_ck') }, days } }, 'streak.config');
  });

  /* ================= Pages & modules ================= */
  const PAGES = [['home', 'Home'], ['notifications', 'Notifications'], ['earnings', 'Earnings'], ['achievements', 'Achievements'], ['token', 'Token Market'], ['mining', 'Token Mining'], ['mxupgrade', 'Mining Upgrade'], ['mxboost', 'Mining Boost'], ['tokendetail', 'Token Details'], ['tokenwd', 'Token Withdraw'], ['buy', 'Buy Token'], ['sell', 'Sell Token'], ['swap', 'Swap'], ['transfer', 'Transfer'], ['earn', 'Earn'], ['mxstreak', '30-Day Streak'], ['mxtasks', 'Tasks'], ['bonus', 'Daily Bonus'], ['spin', 'Spin Wheel'], ['vault', 'Reward Vault'], ['promo', 'Promo Code'], ['events', 'Events'], ['giveaway', 'Giveaway'], ['vip', 'VIP Membership'], ['wallet', 'Wallet'], ['deposit', 'Deposit'], ['withdraw', 'Withdraw'], ['history', 'Transaction History'], ['profile', 'Profile'], ['support', 'Support'], ['security', 'Security']];
  PG.mxpages = {
    title: 'Pages & Modules', deps: ['config'], live: false,
    render() {
      const pc = S.cfg.pages || {}, nav = S.cfg.nav || {};
      return pageHead('Pages & Modules', 'Control the ALL PAGES directory and global module availability', '<button class="btn" data-act="mxPgSave"' + (can('settings') ? '' : ' disabled') + '><i class="fas fa-floppy-disk"></i> Save</button>') + needLock('settings') +
        '<div class="card"><div class="ct"><i class="fas fa-toggle-on"></i> Global modules</div>' + swRow('pm_nav', 'ALL PAGES item in the bottom navigation', 'Hides the nav item (the directory is still reachable from Home)', nav.allpages !== false) + swRow('pm_min', 'Token Mining module', 'Same as the master switch in Mining Settings', M().enabled === true) + swRow('pm_str', 'Daily Streak module', '', (S.cfg.streak || {}).enabled === true) + '</div>' +
        '<div class="card"><div class="ct"><i class="fas fa-table-cells-large"></i> Directory entries <small>A page also disappears automatically when its own feature is disabled elsewhere</small></div><div class="tw"><table><thead><tr><th>Page</th><th>Visible</th><th>NEW badge</th><th>Custom label</th></tr></thead><tbody>' + PAGES.map(p => { const c = pc[p[0]] || {}; return '<tr><td><b>' + esc(p[1]) + '</b> <small class="mono">' + p[0] + '</small></td><td><label class="sw"><input type="checkbox" id="pp_v_' + p[0] + '"' + (c.visible === false ? '' : ' checked') + '><i></i></label></td><td><label class="sw"><input type="checkbox" id="pp_n_' + p[0] + '"' + (c.isNew === true ? ' checked' : '') + '><i></i></label></td><td><input class="inp" id="pp_l_' + p[0] + '" value="' + attr(c.label || '') + '" placeholder="' + attr(p[1]) + '"></td></tr>'; }).join('') + '</tbody></table></div></div>';
    }
  };
  ACT.mxPgSave = (d, el) => runBtn(el, async () => {
    const up = { 'nav/allpages': chk('pm_nav'), 'mining/enabled': chk('pm_min'), 'streak/enabled': chk('pm_str') };
    if (chk('pm_min') && !mcOf().configured) return toast('Configure Level 1 before enabling mining', 'er');
    PAGES.forEach(p => { const c = {}; if (!chk('pp_v_' + p[0])) c.visible = false; if (chk('pp_n_' + p[0])) c.isNew = true; const l = val('pp_l_' + p[0]); if (l) c.label = l; up['pages/' + p[0]] = Object.keys(c).length ? c : null; });
    await saveCfg(up, 'pages.modules');
  });

  /* ================= Mining Monitor (sessions / claims / upgrades / boosts) ================= */
  const flat = (root, tf) => { const o = []; Object.keys(root || {}).forEach(u => Object.keys(root[u] || {}).forEach(k => { const v = root[u][k]; if (v && typeof v === 'object') o.push(Object.assign({ uid: u, _k: k }, v)); })); return o.sort((a, b) => num(b.ts) - num(a.ts)); };
  PG.mxmon = {
    title: 'Mining Monitor', deps: ['users', 'config'], live: false,
    render() {
      const tab = S.mxTab || 'sessions', U = Object.values(S.users), now = Date.now(), mc = mcOf();
      const tabs = [['sessions', 'Sessions & claims'], ['claims', 'Claim history'], ['upgrades', 'Level upgrades'], ['boosts', 'Boosts']];
      const act = U.filter(u => u.mining && u.mining.boost && num(u.mining.boost.until) > now);
      let body = '';
      if (tab === 'sessions') {
        const rows = U.filter(u => u.mining && u.mining.session).map(u => ({ id: String(u.id), u, s: u.mining.session, st: stOf(u) }));
        body = tbl('mxs', [{ h: 'User', f: r => userCell(r.id, r.u.name) }, { h: 'Started', f: r => esc(fdt(r.s.startAt)), v: r => num(r.s.startAt) }, { h: 'Expires', f: r => esc(fdt(r.s.endAt)), v: r => num(r.s.endAt) }, { h: 'Speed', f: r => fmt(r.s.speed, 4), v: r => num(r.s.speed), right: true }, { h: 'Status', f: r => pill((LBL[r.st.status] || LBL.DISABLED)[1], (LBL[r.st.status] || LBL.DISABLED)[0]), v: r => r.st.status }, { h: 'Pending reward', f: r => r.s.status === 'active' ? fmt(r.st.pending ? r.st.pending.total : 0, 4) : (r.s.reward != null ? fmt(r.s.reward, 4) : '—'), right: true }], rows, { hay: r => r.id + ' ' + (r.u.name || ''), ph: 'Search user…', icon: 'fa-hammer', csv: true, empty: 'No mining sessions yet' });
      } else {
        const key = { claims: 'miningHistory', upgrades: 'miningUpgrades', boosts: 'miningBoosts' }[tab];
        if (!S.mxHist || !S.mxHist[key]) body = '<div style="text-align:center;padding:30px"><button class="btn" data-act="mxLoadHist" data-id="' + key + '"><i class="fas fa-download"></i> Load ' + esc(tabs.find(t => t[0] === tab)[1]) + '</button><div class="tiny" style="margin-top:8px">Reads the full collection once.</div></div>';
        else {
          const rows = flat(S.mxHist[key]).filter(x => tab !== 'claims' || x.type === 'claim' || x.type === 'lock' || x.type === 'unlock');
          body = tbl('mxh_' + tab, [{ h: 'When', f: r => esc(fdt(r.ts)), v: r => num(r.ts) }, { h: 'User', f: r => userCell(r.uid) }].concat(tab === 'claims' ? [{ h: 'Event', f: r => esc(r.type) }, { h: 'Base', f: r => r.base != null ? fmt(r.base, 4) : '', right: true }, { h: 'Boost', f: r => r.boost != null ? fmt(r.boost, 4) : '', right: true }, { h: 'Amount / fee', f: r => '<b class="num">' + (r.amount != null ? '+' + fmt(r.amount, 4) : r.fee != null ? '-' + fmt(r.fee, 4) : '') + '</b>', right: true }] : tab === 'upgrades' ? [{ h: 'Change', f: r => 'L' + r.from + ' → L' + r.to + (r.free ? ' <span class="pill pending">free</span>' : r.reset ? ' <span class="pill rejected">reset</span>' : '') }, { h: 'Cost', f: r => fmt(r.cost, 4), v: r => num(r.cost), right: true }, { h: 'Ref', f: r => '<span class="mono tiny">' + esc(r.id) + '</span>' }] : [{ h: 'Multiplier', f: r => '×' + num(r.mult) }, { h: 'Hours', f: r => num(r.hours) }, { h: 'Cost', f: r => fmt(r.cost, 4), v: r => num(r.cost), right: true }, { h: 'State', f: r => num(r.until) > now ? pill('approved', 'Active') : pill('inactive', 'Expired') }]), rows, { hay: r => r.uid + ' ' + uName(r.uid), ph: 'Search user…', icon: 'fa-clock-rotate-left', csv: true, empty: 'No records' });
        }
      }
      const cl = U.filter(u => stOf(u).status === 'CLAIM_AVAILABLE').length, ac = U.filter(u => stOf(u).status === 'MINING_ACTIVE').length, upg = U.reduce((a, u) => a + (u.mining && u.mining.level > 1 ? u.mining.level - 1 : 0), 0);
      return pageHead('Mining Monitor', 'Live sessions, claims, level upgrades and boosts — from real user records') + grid(4, statCard('fa-bolt', 'Mining now', fint(ac), '') + statCard('fa-gift', 'Claim waiting', fint(cl), 'Expired, unclaimed', cl ? 'warn' : '') + statCard('fa-arrow-up', 'Levels gained (all users)', fint(upg), '') + statCard('fa-rocket', 'Active boosts', fint(act.length), act.length ? 'Avg ×' + (act.reduce((a, u) => a + num(u.mining.boost.mult), 0) / act.length).toFixed(2) : '')) +
        '<div class="card"><div class="tabs" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">' + tabs.map(t => '<button class="btn ' + (tab === t[0] ? '' : 'gh') + ' sm" data-act="mxTab" data-id="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>' + body + '</div>';
    }
  };
  ACT.mxTab = d => { S.mxTab = d.id; renderView(); };
  ACT.mxLoadHist = async (d, el) => runBtn(el, async () => { const s = await db.ref(d.id).once('value'); S.mxHist = S.mxHist || {}; S.mxHist[d.id] = s.val() || {}; renderView(); });

  /* ================= Task Monitor (completions, pending verification, history, countdown) ================= */
  PG.mxtasks = {
    title: 'Task Monitor', deps: ['users', 'config'], live: false,
    render() {
      lazy('starts', 'taskStarts', v => { S.mxStarts = v; });
      const w = S.cfg.webTasks || {}, sec = Math.max(10, num((S.cfg.taskVerify || {}).seconds) || 10), now = Date.now();
      const comp = []; Object.values(S.users).forEach(u => Object.keys(u.taskHistory || {}).forEach(k => comp.push({ uid: String(u.id), k, ts: num(u.taskHistory[k]), name: (w[k] || {}).name || k, reward: num((w[k] || {}).reward) })));
      comp.sort((a, b) => b.ts - a.ts);
      const pend = []; Object.keys(S.mxStarts || {}).forEach(u => Object.keys(S.mxStarts[u] || {}).forEach(k => { const st = num(S.mxStarts[u][k]); if (!(u in S.users && (S.users[u].taskHistory || {})[k])) pend.push({ uid: u, k, st, name: (w[k] || {}).name || k, ready: now - st >= sec * 1000 }); }));
      pend.sort((a, b) => b.st - a.st);
      const perTask = Object.keys(w).map(k => ({ k, name: w[k].name || k, n: comp.filter(c => c.k === k).length, reward: num(w[k].reward), on: w[k].visible !== false && !w[k].archived }));
      return pageHead('Task Monitor', 'Completions, tasks waiting for verification and countdown rule. Create / edit / delete tasks stays in Task Management.', '<button class="btn" data-act="mxTvSave"' + (can('settings') ? '' : ' disabled') + '><i class="fas fa-floppy-disk"></i> Save rule</button>') + needLock('settings') +
        grid(4, statCard('fa-circle-check', 'Completions', fint(comp.length), '') + statCard('fa-hourglass-half', 'Waiting for verification', fint(pend.length), fint(pend.filter(p => p.ready).length) + ' ready') + statCard('fa-list-check', 'Official tasks', fint(perTask.length), fint(perTask.filter(t => t.on).length) + ' live') + statCard('fa-coins', 'Rewards paid', fmt(comp.reduce((a, c) => a + c.reward, 0)) + ' ' + esc(sym()), 'Official tasks')) +
        '<div class="card"><div class="ct"><i class="fas fa-stopwatch"></i> Verification countdown</div><div class="fr">' + fld('tv_s', 'Seconds before VERIFY unlocks (minimum 10)', sec, { type: 'number', min: 10, step: '1', hint: 'The start time is a server timestamp enforced by database rules; users cannot shorten it.' }) + '</div></div>' +
        '<div class="card"><div class="ct"><i class="fas fa-hourglass-half"></i> Waiting for verification</div>' + tbl('mxtp', [{ h: 'User', f: r => userCell(r.uid) }, { h: 'Task', f: r => esc(r.name) }, { h: 'Started', f: r => esc(fdt(r.st)), v: r => r.st }, { h: 'State', f: r => r.ready ? pill('pending', 'Ready') : pill('inactive', 'Counting') }], pend, { hay: r => r.uid + r.name, ph: 'Search…', icon: 'fa-hourglass-half', empty: 'Nothing waiting', size: 10 }) + '</div>' +
        '<div class="card"><div class="ct"><i class="fas fa-clock-rotate-left"></i> Completion history</div>' + tbl('mxtc', [{ h: 'When', f: r => esc(fdt(r.ts)), v: r => r.ts }, { h: 'User', f: r => userCell(r.uid) }, { h: 'Task', f: r => esc(r.name) }, { h: 'Reward', f: r => fmt(r.reward), right: true }], comp, { hay: r => r.uid + ' ' + uName(r.uid) + ' ' + r.name, ph: 'Search user or task…', icon: 'fa-inbox', csv: true, empty: 'No completions yet' }) + '</div>' +
        '<div class="card"><div class="ct"><i class="fas fa-chart-simple"></i> Completions per task</div>' + tbl('mxtt', [{ h: 'Task', f: r => esc(r.name) }, { h: 'Status', f: r => r.on ? pill('active', 'Live') : pill('inactive', 'Off') }, { h: 'Completed', f: r => fint(r.n), v: r => r.n, right: true }, { h: 'Reward', f: r => fmt(r.reward), right: true }], perTask, { ph: 'Search…', icon: 'fa-list-check', empty: 'No official tasks', size: 10 }) + '</div>';
    }
  };
  ACT.mxTvSave = (d, el) => runBtn(el, async () => { const s = Math.floor(nv('tv_s')); if (!(s >= 10)) return toast('Minimum is 10 seconds', 'er'); await saveCfg({ 'taskVerify/seconds': s }, 'task.verify'); });

  /* register nav (new section after "Earning") */
  NAV.splice(4, 0, ['Mining & Rewards', [['mxhub', 'fa-hammer', 'Mining Settings'], ['mxlevels', 'fa-stairs', 'Level Editor'], ['mxusers', 'fa-user-gear', 'Mining Users'], ['mxmon', 'fa-gauge-high', 'Mining Monitor'], ['mxtasks', 'fa-list-check', 'Task Monitor'], ['mxstreak', 'fa-fire', 'Daily Streak'], ['mxpages', 'fa-table-cells-large', 'Pages & Modules']]]);
  try { renderNav(); } catch (e) {}
})();

</script>
</body>
</html>
