<script>
/* =====================================================================
   TOKEN SYSTEM — market overview + buy / sell / swap / transfer
   Config lives at  config/token  (admin controlled). Nothing is hard-coded.
===================================================================== */
const TKC = () => (S.cfg.token && typeof S.cfg.token === 'object') ? S.cfg.token : null;
function tokenState() { const c = TKC(); if (!c) return 'none'; if (c.enabled === false) return 'off'; return 'on'; }
const tsym = () => (TKC() && TKC().symbol) || 'TOKEN';
const tname = () => (TKC() && TKC().name) || t('token');
const priceDp = () => { const p = tprice(); return p >= 100 ? 2 : p >= 1 ? 4 : 6; };
const tokenValue = () => num(S.user.tokenBalance) * tprice();
const DP = a => a === 'token' ? 4 : 2;
const unitTxt = a => a === 'token' ? tsym() : a === 'task' ? sym() + ' (' + t('task_bal_short') + ')' : sym();
const opCfg = type => { const c = TKC(); return (c && c[type] && typeof c[type] === 'object') ? c[type] : {}; };
function tokLogo() { const c = TKC(); return (c && c.logo && safeUrl(c.logo)) ? '<img src="' + esc(c.logo) + '" onerror="this.remove()">' : '<i class="fas fa-coins"></i>'; }
function opState(type) {
  const ts = tokenState(); if (ts !== 'on') return ts;
  if (mkParams().paused) return 'off';
  const o = opCfg(type);
  if (!Object.keys(o).length) return 'none';
  if (o.enabled === false) return 'off';
  if (!(opRate(type) > 0)) return 'none';
  if (type === 'transfer' && o.toMainEnabled === false && o.toTaskEnabled === false) return 'off';
  return 'on';
}
function priceChange() {
  const c = TKC(); if (!c) return null;
  const mc = mkChange(); if (mc !== undefined) return mc;
  const p = tprice(); if (!(p > 0)) return null;
  let prev = num(c.prevPrice);
  if (!(prev > 0)) {
    const h = S.priceHist;
    for (let i = h.length - 1; i >= 0; i--) { const v = num(h[i].price); if (v > 0 && Math.abs(v - p) > 1e-12) { prev = v; break; } }
  }
  if (!(prev > 0)) return null;
  return (p - prev) / prev * 100;
}
function chgHtml(pc) {
  if (pc === null) return '<span class="chg na">—</span>';
  return '<span class="chg ' + (pc >= 0 ? 'up' : 'dn') + '"><i class="fas fa-arrow-' + (pc >= 0 ? 'trend-up' : 'trend-down') + '"></i>' + (pc >= 0 ? '+' : '') + pc.toFixed(2) + '%</span>';
}
function priceSrcLabel() {
  if (mkParams().auto || mkParams().paused) return simBadge();
  const c = TKC() || {}, ts = num(c.priceUpdatedAt || c.updatedAt);
  return '<span class="src-tag">' + (c.priceSource === 'external' ? t('mk_live') : t('mk_admin')) + '</span>' + (ts ? ' <span class="tiny">' + t('updated') + ': ' + fdt(ts) + '</span>' : '');
}
/* market pulse — replaces the min/max range (limits are not shown to users) */
function pulseInner() {
  const P = mkParams(); if (!P.auto) return '';
  const now = nowMs(), cur = mkTick(now, P), h = mk24h(), d = priceDp();
  const mom = mkTick(now - 3e5, P) > 0 ? (cur - mkTick(now - 3e5, P)) / mkTick(now - 3e5, P) * 100 : 0, up = mom >= 0;
  const fill = Math.max(6, Math.min(100, 50 + mom * 12));
  return '<div class="pulse"><div class="pl-t"><span class="pl-live"><i></i>' + L2('Market pulse', 'মার্কেট পালস') + '</span><b class="' + (up ? 'up' : 'dn') + '"><i class="fas fa-arrow-' + (up ? 'trend-up' : 'trend-down') + '"></i> ' + (up ? L2('Bullish', 'বুলিশ') : L2('Bearish', 'বেয়ারিশ')) + '</b></div>' +
    '<div class="pl-bar"><em class="' + (up ? 'up' : 'dn') + '" style="width:' + fill.toFixed(0) + '%"></em></div>' +
    '<div class="pl-g"><div><span>' + L2('5m move', '৫ মিনিট') + '</span><b class="' + (up ? 'pos' : 'neg') + '">' + (up ? '+' : '') + mom.toFixed(2) + '%</b></div><div><span>' + L2('24H high', '২৪ঘ সর্বোচ্চ') + '</span><b>' + fmt(h.hi, d) + '</b></div><div><span>' + L2('24H low', '২৪ঘ সর্বনিম্ন') + '</span><b>' + fmt(h.lo, d) + '</b></div></div></div>';
}
function rangeHtml() { return '<div class="js-pulse">' + pulseInner() + '</div>'; }
function priceChartHtml() {
  const h = S.priceHist.filter(x => num(x.price) > 0);
  if (h.length < 2) return '';
  const W = 300, H = 120, pd = 8, vals = h.map(x => num(x.price)), mn = Math.min(...vals), mx = Math.max(...vals), span = (mx - mn) || 1;
  const pts = vals.map((v, i) => [pd + i * (W - 2 * pd) / (vals.length - 1), H - pd - (v - mn) / span * (H - 2 * pd)]);
  const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = pd + ',' + (H - pd) + ' ' + line + ' ' + (W - pd) + ',' + (H - pd);
  const up = vals[vals.length - 1] >= vals[0];
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + (up ? 'var(--pos)' : 'var(--neg)') + '" stop-opacity=".35"/><stop offset="1" stop-color="' + (up ? 'var(--pos)' : 'var(--neg)') + '" stop-opacity="0"/></linearGradient></defs><polygon points="' + area + '" fill="url(#cg)"/><polyline points="' + line + '" fill="none" stroke="' + (up ? 'var(--pos)' : 'var(--neg)') + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg><div class="chart-l"><span>' + fdate(h[0].ts) + '</span><span>' + fdate(h[h.length - 1].ts) + '</span></div></div>';
}
function marketCard() {
  const p = tprice(), d = priceDp(), u = S.user, r = S.userReady, tk = tokenState();
  const own = num(u.tokenBalance);
  return '<div class="card hero tkx"><div class="tkx-orbit"></div>' +
    '<div class="tkx-top"><div class="tkx-coin"><div class="mk-logo">' + tokLogo() + '</div><div><b>' + esc(tname()) + '</b><span class="tkx-pair">' + esc(tsym()) + ' / ' + esc(sym()) + '</span></div></div><span class="js-mk-chg">' + chgHtml(priceChange()) + '</span></div>' +
    '<div class="tkx-lab"><span>' + t('cur_price') + '</span><span class="tkx-live"><i></i>' + L2('LIVE', 'লাইভ') + '</span></div>' +
    '<div class="mk-price num"><span class="js-mk-price">' + (p > 0 ? fmt(p, d) : '—') + '</span> <small>' + sym() + '</small></div>' +
    (candleList(40, 1).length ? mkChartHtml() : priceChartHtml()) + rangeHtml() +
    '<div class="tkx-wal"><div class="sh-box"><span>' + L2('Your holdings', 'আপনার হোল্ডিং') + '</span><b>' + (r ? fmt(own, 4) : '—') + ' <small>' + esc(tsym()) + '</small></b></div>' +
    '<div class="sh-box"><span>' + t('est_value') + '</span><b class="pos">' + (r && p > 0 ? fmt(tokenValue()) : '—') + ' <small>' + esc(sym()) + '</small></b></div></div>' +
    '<div style="margin-top:12px">' + priceSrcLabel() + '</div></div>';
}
function holdingsCard() {
  const u = S.user, r = S.userReady;
  return '<div class="card"><div class="card-t"><i class="fas fa-gem"></i> ' + t('your_holdings') + '</div>' +
    kv(t('token_bal'), skv(fmt(u.tokenBalance, 4) + ' ' + esc(tsym()))) + kv(t('cur_price'), tprice() > 0 ? fmt(tprice(), priceDp()) + ' ' + sym() : '—') +
    kv(t('est_value'), r && tprice() > 0 ? '<span class="pos">' + fmt(tokenValue()) + ' ' + sym() + '</span>' : (r ? '—' : skv(''))) + '</div>';
}
function unavailable(st) { return '<div class="card" style="margin-top:4px">' + emptyHtml(st === 'off' ? 'fa-screwdriver-wrench' : 'fa-gear', t(st === 'off' ? 'tk_off_msg' : 'tk_none_msg')) + '</div>'; }
let TKF = 'all';
function renderToken() {
  const st = tokenState();
  let h = '<div class="top"><div><h1 class="h1">' + t('nav_token') + '</h1><div class="tiny">' + t('token_sub') + '</div></div><button class="iconbtn" data-act="openSub" data-id="history" data-p="buy"><i class="fas fa-receipt"></i></button></div>';
  if (st === 'none') { h += unavailable('none'); if (num(S.user.tokenBalance) > 0) h += holdingsCard(); $('tab-token').innerHTML = h; return; }
  h += marketCard();
  if (st === 'off') h += '<div class="note bad" style="margin:0 16px 14px"><i class="fas fa-screwdriver-wrench"></i><span>' + t('tk_off_msg') + '</span></div>';
  const ops = [['buy', 'fa-cart-plus'], ['sell', 'fa-hand-holding-dollar'], ['swap', 'fa-right-left'], ['transfer', 'fa-paper-plane']];
  const extra = '<button class="op" data-act="openSub" data-id="tokendetail"><i class="fas fa-chart-simple"></i><h4>' + L2('Token Details', 'টোকেন ডিটেইলস') + '</h4><p>' + L2('Chart, stats & history', 'চার্ট, তথ্য ও ইতিহাস') + '</p></button><button class="op ' + (twdState() === 'on' ? '' : 'off') + '" data-act="openSub" data-id="tokenwd"><i class="fas fa-arrow-up-from-bracket"></i><h4>' + L2('Withdraw', 'উত্তোলন') + '</h4><p>' + (twdState() === 'on' ? L2('Fee', 'ফি') + ' ' + num(twdCfg().feePct) + '%' : t('tk_unavail')) + '</p></button>';
  const icmap = { buy: 'fa-cart-plus', sell: 'fa-hand-holding-dollar', swap: 'fa-right-left', transfer: 'fa-paper-plane' };
  h += '<div class="sec"><span>' + t('tk_ops') + '</span></div><div class="tkx-ops">' + ops.map(o => {
    const s2 = opState(o[0]);
    return '<button class="tkx-op ' + (s2 === 'on' ? '' : 'off') + '" data-act="openOp" data-id="' + o[0] + '"><i class="fas ' + o[1] + '"></i><b>' + t('tk_' + o[0]) + '</b><small>' + (s2 === 'on' ? fmt(opRate(o[0]), 4) : t('tk_unavail')) + '</small></button>';
  }).join('') + '</div><div class="pad grid2" style="padding-top:0">' + extra + '</div>';
  const fl = ['all', 'buy', 'sell', 'swap', 'transfer'];
  h += '<div class="sec"><span>' + t('tk_activity') + '</span><a data-act="openSub" data-id="history" data-p="buy" style="cursor:pointer">' + t('view_all') + '</a></div><div class="chips">' + fl.map(f => '<button class="chip ' + (TKF === f ? 'on' : '') + '" data-act="tkf" data-id="' + f + '">' + (f === 'all' ? t('all') : t('tk_' + f)) + '</button>').join('') + '</div>';
  const list = S.tokHist.map(nTok).filter(x => TKF === 'all' || x.cat === TKF).sort((a, b) => b.ts - a.ts).slice(0, 8);
  h += '<div class="card flat">' + (list.length ? list.map(txRow).join('') : emptyHtml('fa-inbox', t('no_tx'))) + '</div>';

ACT.tkf = d => { TKF = d.id; renderToken(); };

/* ---------------- Quote engine ---------------- */
const OP = { type: 'buy', src: 'main', dst: 'token', amt: '', busy: false, review: null };
function initOp(type) {
  OP.type = type; OP.amt = ''; OP.review = null;
  const o = opCfg(type);
  if (type === 'buy') { OP.src = 'main'; OP.dst = 'token'; }
  else if (type === 'sell') { OP.src = 'token'; OP.dst = 'main'; }
  else if (type === 'transfer') { OP.src = 'token'; OP.dst = o.toMainEnabled !== false ? 'main' : 'task'; }
  else { OP.src = 'main'; OP.dst = 'token'; }
}
function opSides(type) {
  if (type === 'buy') return ['main', 'token'];
  if (type === 'sell') return ['token', 'main'];
  if (type === 'transfer') return ['token', OP.dst === 'task' ? 'task' : 'main'];
  return [OP.src, OP.dst];
}
function quote(type, src, dst, amtRaw) {
  const o = opCfg(type), rate = opRate(type);
  let pct = opFeeOn(o) ? num(o.feePct !== undefined ? o.feePct : o.fee) : 0; pct = Math.max(0, Math.min(100, pct));
  const gasCur = opGasCur(o);
  const q = { type, src, dst, rate, feePct: pct, gasCur, amt: 0, ok: false, err: '', empty: false };
  if (opState(type) !== 'on') { q.err = t('tk_unavail'); return q; }
  if (type === 'transfer') {
    if (dst === 'main' && o.toMainEnabled === false) { q.err = t('tk_dest_off'); return q; }
    if (dst === 'task' && o.toTaskEnabled === false) { q.err = t('tk_dest_off'); return q; }
  }
  if (type === 'swap' && (src === dst || (src === 'token') === (dst === 'token'))) { q.err = t('tk_swap_pair'); return q; }
  const a = Number(amtRaw);
  if (!(a > 0)) { q.empty = true; return q; }
  const dpS = DP(src), dpD = DP(dst);
  if (Math.abs(rnd(a, dpS) - a) > 1e-9) { q.err = t('err_dec', dpS); return q; }
  q.amt = rnd(a, dpS);
  const mn = num(o.min), mx = num(o.max);
  if (mn > 0 && q.amt < mn) { q.err = t('err_min', fmt(mn, dpS) + ' ' + unitTxt(src)); return q; }
  if (mx > 0 && q.amt > mx) { q.err = t('err_max', fmt(mx, dpS) + ' ' + unitTxt(src)); return q; }
  if (q.amt > num(S.user[FIELD[src]]) + 1e-9) { q.err = t('err_bal'); return q; }
  const gross = src === 'token' ? q.amt * rate : q.amt / rate;
  const gasD = dst === 'token' ? gasCur / rate : gasCur;   /* fixed gas fee is set in the currency, converted at the live price */
  const out = flr(gross * (1 - pct / 100) - gasD, dpD), fee = rnd(gross - out, dpD + 2);
  if (!(out > 0)) { q.err = t('err_small'); return q; }
  q.gross = rnd(gross, 8); q.out = out; q.fee = fee; q.gas = rnd(gasD, dpD + 2);
  q.tokenQty = src === 'token' ? q.amt : rnd(gross, 4);
  q.cashValue = src === 'token' ? rnd(gross, 4) : q.amt;
  q.ok = true; return q;
}
function qLines(q) {
  const dpS = DP(q.src), dpD = DP(q.dst);
  return kv(q.type === 'buy' ? t('total_payable') : t('you_send'), fmt(q.amt, dpS) + ' ' + unitTxt(q.src)) +
    kv(L2('Market price', 'মার্কেট প্রাইস'), '1 ' + esc(tsym()) + ' = ' + fmt(q.rate, 6) + ' ' + sym()) +
    kv(t('fee') + ' (' + q.feePct + '%' + (q.gas > 0 ? ' + ' + L2('gas', 'গ্যাস') : '') + ')', '- ' + fmt(q.fee, dpD) + ' ' + unitTxt(q.dst), 'neg') +
    kv(q.type === 'buy' ? t('est_tokens') : t('est_receive'), fmt(q.out, dpD) + ' ' + unitTxt(q.dst), 'pos');
}

/* ---------------- Operation page ---------------- */
SUBS.tokenop = {
  title: p => t('tk_' + p.p),
  render: p => renderOp(p.p),
  after: () => { applyI18n(); opUpdate(); },
  onData: () => opBalRefresh()
};
ACT.openOp = d => { initOp(d.id); openSub('tokenop', { p: d.id }); };
function renderOp(type) {
  const st = opState(type);
  if (st !== 'on') return unavailable(st);
  const o = opCfg(type), s = opSides(type), src = s[0], dst = s[1], dpS = DP(src);
  let pct = opFeeOn(o) ? num(o.feePct !== undefined ? o.feePct : o.fee) : 0;
  let h = '<div class="card hero" style="margin-top:4px"><div class="tiny">' + L2('Live market price', 'লাইভ মার্কেট প্রাইস') + '</div><div class="mk-price num"><span class="js-mk-price">' + fmt(tprice(), priceDp()) + '</span> <small>' + sym() + '</small></div>' + kv(t('fee'), pct + '%') + (opGasCur(o) > 0 ? kv(L2('Gas fee', 'গ্যাস ফি'), fmt(opGasCur(o), 4) + ' ' + sym()) : '') +
    kv(t('min_amt'), num(o.min) > 0 ? fmt(o.min, dpS) + ' ' + unitTxt(src) : '—') + kv(t('max_amt'), num(o.max) > 0 ? fmt(o.max, dpS) + ' ' + unitTxt(src) : '—') + '</div><div class="card">';
  if (type === 'transfer') {
    h += '<div class="field"><label>' + t('destination') + '</label></div><div class="seg c2">' +
      '<button class="' + (dst === 'main' ? 'on' : '') + (o.toMainEnabled === false ? ' dis' : '') + '" data-act="opDest" data-id="main"><i class="fas fa-wallet"></i> ' + t('main_bal') + '</button>' +
      '<button class="' + (dst === 'task' ? 'on' : '') + (o.toTaskEnabled === false ? ' dis' : '') + '" data-act="opDest" data-id="task"><i class="fas fa-layer-group"></i> ' + t('task_bal') + '</button></div>';
  }
  if (type === 'swap') {
    const opts = sel => ['main', 'task', 'token'].map(a => '<option value="' + a + '"' + (sel === a ? ' selected' : '') + '>' + t('as_' + a) + '</option>').join('');
    h += '<div class="grid2" style="align-items:end"><div class="field"><label>' + t('swap_from') + '</label><select class="inp" id="opSrc" data-ch="opPair">' + opts(src) + '</select></div><div class="field"><label>' + t('swap_to') + '</label><select class="inp" id="opDst" data-ch="opPair">' + opts(dst) + '</select></div></div>' +
      '<div style="text-align:center;margin:-4px 0 10px"><button class="btn sm ghost inline" data-act="opFlip"><i class="fas fa-arrows-up-down"></i></button></div>';
  }
  const lbl = type === 'buy' ? t('amt_spend') : t('amount');
  h += '<div class="field"><label><span>' + lbl + ' (' + unitTxt(src) + ')</span><b data-act="opMax">' + t('max') + '</b></label><input class="inp" id="opAmt" type="number" inputmode="decimal" step="any" placeholder="0.00" data-in="opAmt" value="' + esc(OP.amt) + '"><div class="hint">' + t('available') + ': <b id="opAvail">' + fmt(S.user[FIELD[src]], dpS) + ' ' + unitTxt(src) + '</b></div></div>' +
    '<div class="qbox" id="opQ" hidden></div><div class="qerr" id="opErr" hidden></div>' +
    '<button class="btn" data-act="opReview"><i class="fas fa-eye"></i> ' + t('review') + '</button></div>';
  return h;
}
function opUpdate() {
  const inp = $('opAmt'); if (!inp) return;
  OP.amt = inp.value;

/* ---------------- Execution (idempotent, debit → credit, rollback on failure) ---------------- */
async function execToken(q0) {
  if (!q0 || OP.busy) return;
  OP.busy = true; closeSheet(); busy(true, t('processing'), 15);
  let rec = null;
  try {
    const snap = await db.ref('config/token').once('value');   /* always use the freshest admin rate */
    S.cfg.token = snap.val();
    const q = quote(q0.type, q0.src, q0.dst, q0.amt);
    if (!q.ok) { busy(false); toast(q.err || t('tk_unavail')); renderAll(); return; }
    const slip = num(((TKC() || {}).market || {}).slippagePct) || 1;
    if (q.feePct !== q0.feePct || q.gasCur !== q0.gasCur || Math.abs(q.rate - q0.rate) / Math.max(q0.rate, 1e-12) * 100 > slip) { busy(false); toast(t('rate_changed')); renderSub(false); return; }
    if ((TKC() || {}).secureExec === true) {   /* trusted path: a Cloud Function prices + executes the order atomically */
      busy(true, t('processing'), 45);
      const r = await execSecure(q);
      if (!r || !r.ok) { busy(false); toast(r && r.error ? r.error : t('fail_generic')); renderAll(); return; }
      const sn = await db.ref('tokenTransactions/' + r.txId).once('value'); const srec = sn.val();
      if (srec) { OP.amt = ''; await finalizeTok(srec, 'completed', ''); showTokResult(srec); }
      return;
    }
    const txId = 'TKN' + Date.now() + rid();
    rec = { txId, userId: uid, userName: tgUser.first_name || 'User', type: q.type, source: q.src, destination: q.dst, amountIn: q.amt, amountOut: q.out, fee: q.fee, feeUnit: q.dst, feePct: q.feePct, gasFee: q.gas || 0, gasCur: q.gasCur || 0, executionPrice: q.rate, rate: q.rate, tokenQuantity: q.tokenQty, cashValue: q.cashValue, tokenSymbol: tsym(), marketPrice: tprice() || null, status: 'processing', timestamp: Date.now() };
    busy(true, t('processing'), 35);
    const cr = await db.ref('tokenTransactions/' + txId).transaction(c => c ? undefined : rec);   /* idempotency guard */
    if (!cr.committed) { busy(false); toast(t('dup_tx')); return; }
    busy(true, t('processing'), 60);
    const debited = await adjUser(FIELD[q.src], -q.amt);
    if (!debited) { await finalizeTok(rec, 'failed', t('err_bal')); showTokResult(rec); return; }
    busy(true, t('processing'), 80);
    const credited = await adjUser(FIELD[q.dst], q.out);
    if (!credited) { await adjUser(FIELD[q.src], q.amt); await finalizeTok(rec, 'failed', t('err_credit')); showTokResult(rec); return; }
    await finalizeTok(rec, 'completed', '');
    OP.amt = ''; showTokResult(rec);
  } catch (e) {
    console.error(e);
    if (rec && rec.status === 'processing') { try { await finalizeTok(rec, 'failed', 'error'); } catch (e2) {} }
    toast(t('fail_generic'));
  } finally { OP.busy = false; busy(false); }
}
function execSecure(q) {
  const oid = 'ORD' + Date.now() + rid(), ref = db.ref('tokenOrders/' + uid + '/' + oid);
  return new Promise(async resolve => {
    let done = false; const fin = v => { if (done) return; done = true; try { ref.child('result').off(); } catch (e) {} resolve(v); };
    setTimeout(() => fin({ ok: false, error: L2('Server did not respond. Please try again.', 'সার্ভার সাড়া দেয়নি। আবার চেষ্টা করুন।') }), 25000);
    ref.child('result').on('value', s => { if (s.exists()) fin(s.val()); });
    try { await ref.set({ type: q.type, src: q.src, dst: q.dst, amt: q.amt, quotedPrice: q.rate, ts: firebase.database.ServerValue.TIMESTAMP }); } catch (e) { fin({ ok: false, error: t('fail_generic') }); }
  });
}
async function finalizeTok(rec, status, reason) {
  rec.status = status; rec.completedAt = Date.now(); if (reason) rec.failReason = reason;
  const upd = { status, completedAt: rec.completedAt }; if (reason) upd.failReason = reason;
  try { await db.ref('tokenTransactions/' + rec.txId).update(upd); } catch (e) {}
  try { await db.ref('tokenHistory/' + uid + '/' + rec.txId).set(rec); } catch (e) {}
  try { const r = await db.ref('tokenTransactions/' + rec.txId + '/statsApplied').transaction(c => c ? undefined : true); if (r.committed) await applyStats(rec); } catch (e) {}
  const un = a => a === 'token' ? rec.tokenSymbol : sym();
  if (status === 'completed') notify('token', t('tk_notif_ok', t('tk_' + rec.type)), fmt(rec.amountIn, DP(rec.source)) + ' ' + un(rec.source) + ' → ' + fmt(rec.amountOut, DP(rec.destination)) + ' ' + un(rec.destination) + '\n' + t('tx_id') + ': ' + rec.txId, 'tok_' + rec.txId);
  else notify('token', t('tk_notif_fail', t('tk_' + rec.type)), (rec.failReason || '') + '\n' + t('tx_id') + ': ' + rec.txId, 'tok_' + rec.txId);
}
/* Analytics counters for the Admin panel: total tx, unique users, quantity, value, success/failed. */
async function applyStats(rec) {
  const base = 'tokenStats/' + rec.type, ok = rec.status === 'completed';
  await db.ref(base).transaction(s => {
    s = s || {};
    s.count = (s.count || 0) + 1;
    if (ok) {
      s.completedCount = (s.completedCount || 0) + 1;
      s.totalTokens = rnd((s.totalTokens || 0) + num(rec.tokenQuantity), 6);
      s.totalValue = rnd((s.totalValue || 0) + num(rec.cashValue), 4);
      s.totalFees = rnd((s.totalFees || 0) + num(rec.fee), 6);
      if (rec.type === 'transfer') { if (rec.destination === 'main') s.toMainTokens = rnd((s.toMainTokens || 0) + num(rec.tokenQuantity), 6); else s.toTaskTokens = rnd((s.toTaskTokens || 0) + num(rec.tokenQuantity), 6); }
    } else s.failedCount = (s.failedCount || 0) + 1;
    s.updatedAt = Date.now(); return s;
  });
  if (ok) {
    const r = await db.ref('tokenUsers/' + rec.type + '/' + rec.userId).transaction(c => c ? undefined : { firstAt: Date.now() });
    if (r.committed) await db.ref(base + '/uniqueUsers').transaction(n => (n || 0) + 1);
  }
}
function showTokResult(rec) {
  const ok = rec.status === 'completed', un = a => a === 'token' ? esc(rec.tokenSymbol) : sym();

ACT.wdQuick = d => { const mx = num(S.cfg.maxWithdraw); let v = flr(num(S.user.balance) * num(d.id) / 100, 2); if (mx > 0 && v > mx) v = mx; $('wd-amount').value = v > 0 ? v : ''; wdFeePreview(); };
function wdFeePreview() {
  const a = Number($('wd-amount').value), box = $('wd-fee');
  if (!(a > 0)) { box.hidden = true; return; }
  const k = calcCharge(a), s = sym();
  box.hidden = false;
  box.innerHTML = kv(t('requested'), fmt(a) + ' ' + s) + kv(t('charge') + ' (' + k.pct + '%)', '- ' + fmt(k.charge) + ' ' + s, 'neg') + kv(t('you_receive'), fmt(Math.max(0, k.receive)) + ' ' + s, 'pos');
}
INP.wdAmt = () => wdFeePreview();
function drawWdHist() {
  const items = Object.entries(S.user.withdrawHistory || {}).filter(e => e[1]).map(e => nWd(e[1], e[0])).sort((a, b) => b.ts - a.ts);

}
ACT.wdf = d => { WDF = d.id; drawWdHist(); };
ACT.wdReview = () => {
  const c = S.cfg, method = $('wd-method').value, account = $('wd-account').value.trim(), amount = Number($('wd-amount').value);
  const minWd = num(c.minWithdraw || 10), maxWd = num(c.maxWithdraw), refs = num(S.user.referrals), need = num(c.withdrawRefRequired || 5);
  if (refs < need) return toast(t('wd_need_refs_sub', need));

  openSheet('<h3><i class="fas fa-paper-plane" style="color:var(--accent)"></i>' + t('wd_details') + '</h3><div class="qbox">' + kv(t('method'), esc(method)) + kv(t('account'), esc(account)) + kv(t('requested'), fmt(amount) + ' ' + s) + kv(t('charge') + ' (' + k.pct + '%)', '- ' + fmt(k.charge) + ' ' + s, 'neg') + kv(t('you_receive'), fmt(Math.max(0, k.receive)) + ' ' + s, 'pos') + kv(t('deducted_now'), '- ' + fmt(amount) + ' ' + s, 'neg') + '</div>' +
    '<div class="note warn"><i class="fas fa-triangle-exclamation"></i><span>' + t('wd_warn') + '</span></div><div class="btns"><button class="btn ghost" data-act="closeSheet"><i class="fas fa-arrow-left"></i> ' + t('edit') + '</button><button class="btn" data-act="wdConfirm"><i class="fas fa-check"></i> ' + t('confirm') + '</button></div>');

let _wdBusy = false;
ACT.wdConfirm = async () => {
  if (_wdBusy) return;
  const c = S.cfg, method = $('wd-method').value, account = $('wd-account').value.trim(), amount = Number($('wd-amount').value);
  if (!method || !account || !(amount > 0)) return;
  _wdBusy = true; closeSheet();

  let deducted = false;
  try {
    busy(true, t('wd_verifying'), 20); await sleep(400);
    const ok = await adjUser('balance', -amount);                      /* atomic: fails if balance is insufficient */
    if (!ok) { busy(false); toast(t('err_bal')); return; }
    deducted = true; busy(true, t('wd_processing'), 55);
    const wdId = 'WD' + Date.now();
    const d = { wdId, userId: uid, userName: S.user.name || tgUser.first_name || 'User', method, account, amount, chargePct: pct, chargeAmount: charge, finalAmount, status: 'pending', timestamp: Date.now() };
    await db.ref('withdrawals/' + wdId).set(d);
    await db.ref('users/' + uid + '/withdrawHistory/' + wdId).set(d);
    await adjUser('totalWithdrawn', amount);
    busy(true, t('done'), 100); await sleep(500); busy(false);
    $('wd-account').value = ''; $('wd-amount').value = ''; wdFeePreview();
    const s = sym();
    openSheet('<div class="res"><div class="big ok"><i class="fas fa-check"></i></div><h3>' + t('wd_submitted') + '</h3></div><div class="qbox">' + kv(t('request_id'), esc(wdId)) + kv(t('requested'), fmt(amount) + ' ' + s) + kv(t('you_receive'), fmt(finalAmount) + ' ' + s, 'pos') + kv(t('status'), stLabel('pending')) + '</div><div class="btns"><button class="btn ghost" data-act="closeSheet">' + t('close') + '</button><button class="btn" data-act="openSub" data-id="txdetail" data-p="wd_' + wdId + '">' + t('track') + '</button></div>');

  } catch (e) {
    console.error(e); busy(false);
    if (deducted) await adjUser('balance', amount);                    /* roll back the deduction if records could not be written */
    toast(t('wd_fail'));
  } finally { _wdBusy = false; busy(false); }
};

/* ---------- Live watchers: deposit / withdrawal status changes ---------- */
const W = { dep: {}, wd: {} };
function syncWatchers() {
  const u = S.user; try { twdWatch(); } catch (e) {}
  const sync = (store, hist, root, handler) => {
    Object.entries(hist || {}).forEach(([k, i]) => {
      if (!i) return;
      const id = i.depId || i.wdId || k, pend = ['pending', 'processing'].includes(i.status || 'pending');
      if (pend && !store[id]) {
        const ref = db.ref(root + '/' + id);
        const cb = ref.on('value', s => { if (s.exists()) handler(id, s.val()); });
        store[id] = { ref, cb };
      } else if (!pend && store[id]) { store[id].ref.off('value', store[id].cb); delete store[id]; }
    });
  };
  sync(W.dep, u.depositHistory, 'depositRequests', (id, gd) => {
    if (!gd.status || gd.status === 'pending') return;
    const upd = { status: gd.status }; if (gd.adminNote) upd.adminNote = gd.adminNote;
    db.ref('users/' + uid + '/depositHistory/' + id).update(upd); db.ref('deposits/' + id).update(upd);
    const ok = gd.status === 'approved';
    toast(ok ? t('dep_ok_toast') : t('dep_bad_toast'));
    if (gd.status === 'approved' || gd.status === 'rejected') NT.send(uid, ok ? 'dep_approved' : 'dep_rejected', 'dep_' + id + '_' + gd.status, { id, amount: gd.amount, method: gd.method, txn: gd.txId || gd.transactionId, reason: gd.adminNote });
  });
  sync(W.wd, u.withdrawHistory, 'withdrawals', (id, gd) => {
    if (!gd.status || gd.status === 'pending') return;
    const cur = (u.withdrawHistory[id] || {}).status; if (cur !== gd.status) db.ref('users/' + uid + '/withdrawHistory/' + id).update({ status: gd.status });
    if (gd.status === 'processing') { NT.send(uid, 'wd_processing', 'wd_' + id + '_processing', { id, amount: gd.amount, net: gd.finalAmount, method: gd.method }); return; }
    if (gd.status === 'approved' || gd.status === 'rejected') showWdStatus(gd.status, gd, id);
  });
}
function showWdStatus(status, d, id) {
  const ok = status === 'approved', s = sym(), amt = d.finalAmount !== undefined ? d.finalAmount : d.amount;
  openSheet('<div class="res"><div class="big ' + (ok ? 'ok' : 'bad') + '"><i class="fas fa-' + (ok ? 'check' : 'xmark') + '"></i></div><h3>' + (ok ? t('wd_ok_title') : t('wd_bad_title')) + '</h3></div><div class="qbox">' + kv(t('method'), esc(d.method || '—')) + kv(t('amount'), esc(amt) + ' ' + s) + kv(t('status'), stLabel(status)) + '</div><div class="note ' + (ok ? '' : 'bad') + '"><span>' + (ok ? t('wd_ok_msg') : t('wd_bad_msg')) + '</span></div><button class="btn ghost" data-act="closeSheet">' + t('got_it') + '</button>');
  NT.send(uid, ok ? 'wd_approved' : 'wd_rejected', 'wd_' + id + '_' + status, { id, amount: d.amount, net: d.finalAmount, method: d.method, account: d.account, reason: d.adminNote || d.reason, payRef: d.payRef || d.paymentRef });
}

<script>

let _adBusy = false;

/* ---------- Ads ---------- */
function renderAds() {

/* ---------- Admin tasks (webTasks) ---------- */
function taskLive(x) { return !!x && x.visible !== false && !x.archived && !(num(x.expiresAt) && num(x.expiresAt) < Date.now()) && x.status !== 'disabled'; }
const _tb = {};
function renderAdminTasks() {

    const x = tasks[k], done = !!(S.user.taskHistory && S.user.taskHistory[k]);

  }).join('');

  if (num(x.completionLimit) > 0 && num(x.completedCount) >= num(x.completionLimit)) return toast(t('task_full'));

  try {
    openLink(x.url); await sleep(3500);
    const r = await db.ref('users/' + uid + '/taskHistory/' + k).transaction(c => c ? undefined : Date.now());
    if (!r.committed) return;

INP.taskCost = () => {

ACT.createTask = async () => {
  const link = $('ct-link').value.trim(), type = $('ct-type').value, reward = Number($('ct-reward').value), limit = Number($('ct-limit').value);
  const ts = S.cfg.taskSettings || S.cfg.taskBalanceSettings || {}, minR = num(ts.minReward || 1), maxP = num(ts.maxParticipants || 1000), tbal = num(S.user.taskBalance);
  if (!link || !safeUrl(link)) return toast(t('task_need_link'));
  if (!type) return toast(t('task_need_type'));
  if (!reward || reward < minR) return toast(t('min') + ' ' + t('task_reward') + ': ' + minR + ' ' + sym());
  if (!limit || limit < 1 || Math.floor(limit) !== limit) return toast(t('task_need_limit'));
  if (limit > maxP) return toast(t('max') + ' ' + t('task_limit') + ': ' + maxP);
  const total = +(reward * limit).toFixed(2);
  /* admin-controlled rules (config/taskSettings) */
  const maxR = num(ts.maxReward), minP = Math.max(1, num(ts.minParticipants || 1)), fp = Math.max(0, Math.min(90, num(ts.feePct))), perDay = Math.floor(num(ts.dailyCreateLimit));

ACT.doActiveTask = async d => {
  const id = d.id; if (_tb[id]) return;
  const snap = await db.ref('activeTasks/' + id).once('value'); if (!snap.exists()) return toast(t('not_found'));
  const x = snap.val();
  if (x.status !== 'active') return toast(t('task_inactive'));
  if (String(x.creatorId) === uid) return toast(t('task_own'));
  if (x.participants && x.participants[uid]) return toast(t('task_already'));
  if (num(x.participantsCompleted) >= num(x.participantLimit)) return toast(t('slots_full'));
  _tb[id] = true;
  try {
    openLink(x.link); await sleep(4000);
    const r = await db.ref('activeTasks/' + id).transaction(c => {     /* atomic slot reservation */
      if (!c) return c;
      if (c.status !== 'active' || String(c.creatorId) === uid) return;
      const done = num(c.participantsCompleted), lim = num(c.participantLimit);
      if (done >= lim || (c.participants && c.participants[uid])) return;
      c.participants = c.participants || {}; c.participants[uid] = { timestamp: Date.now(), name: tgUser.first_name || 'User' };
      c.participantsCompleted = done + 1; if (done + 1 >= lim) c.status = 'completed';
      return c;
    });
    if (!r.committed || !r.snapshot.exists()) return toast(t('slots_full'));
    const nv = r.snapshot.val();
    await db.ref('userTasks/' + id).update({ participants: num(nv.participantsCompleted), ...(nv.status === 'completed' ? { status: 'completed' } : {}) });
    const reward = num(x.reward);
    if (await earn(reward, 'active_task', id)) {
      await db.ref('users/' + uid + '/activeTaskHistory/' + id).set({ reward, timestamp: Date.now() });
      toast('+' + reward + ' ' + sym() + ' ' + t('task_done')); NT.send(uid, 'task_done', 'taskdone_a' + id, { id, title: x.title || x.name || x.type || '', type: x.type || '' }); NT.send(uid, 'task_reward', 'taskrw_a' + id, { id, title: x.title || x.name || x.type || '', reward });
    }

};

const _adsgramControllers = {};

const _monetagLoaded = {};
function loadMonetagSDK(zoneId) {
  return new Promise((resolve) => {

    if (_monetagLoaded[zoneId]) {
      let att = 0;
      const p = setInterval(() => { att++; if (typeof window[fnName] === 'function' || att > 50) { clearInterval(p); resolve(); } }, 200);

const _gigapubState = { loaded: false, loading: false };
function loadGigaPubSDK(appId) {

}

async function getDeviceFingerprint() {
  const parts = [navigator.userAgent, navigator.language, screen.width + 'x' + screen.height, Intl.DateTimeFormat().resolvedOptions().timeZone];
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(parts.join('|')));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 24);
}

    '<button class="btn ghost" data-act="closeSheet" style="margin-top:6px">' + L2('Close', 'বন্ধ করুন') + '</button>';

<script>
/* =====================================================================

   Paths: users/{uid}/mining|streak30|quizAns|quizStats|quizDaily|quizWeekly|boost|boostPurchases|favPages
   Nodes: miningHistory miningUpgrades dailyStreakClaims quizPool quizBoard
   Cfg:   config/mining config/miningLevels config/miningBoost config/streak30 config/quiz config/allpages
===================================================================== */
/* =====================================================================
   NEXAVAULT — ADVANCED MINING & REWARDS SUITE  (additive module)
   Prefixes: CSS .nxm-* / JS window.NX_* — no existing symbol is touched
===================================================================== */
window.NX_BUSY = false;

/* ---------------- Config readers (admin-configured, safe defaults) ---------------- */
const NXM = () => (S.cfg && S.cfg.mining) || {};
const nxmCfg = () => {
  const m = NXM();
  return {
    enabled: m.enabled !== false,
    sessionHours: num(m.sessionHours) > 0 ? num(m.sessionHours) : 24,
    maxLevel: 100,
    freeUpgrade: m.freeUpgrade !== false,
    claimsAfterExpireHours: num(m.claimsAfterExpireHours) > 0 ? num(m.claimsAfterExpireHours) : 48
  };
};
const nxmInact = () => {
  const c = (NXM().inactivity) || {};
  return { enabled: c.enabled !== false, thresholdHours: num(c.thresholdHours) > 0 ? num(c.thresholdHours) : 48, unlockFee: num(c.unlockFee) > 0 ? num(c.unlockFee) : 100 };
};
const nxmBoostCfg = () => {
  const c = S.cfg.miningBoost || {};
  return {
    enabled: c.enabled !== false && NXM().boostEnabled !== false,
    durationHours: num(c.durationHours) > 0 ? num(c.durationHours) : 24,
    multiplier: num(c.multiplier) > 1 ? num(c.multiplier) : 2,
    cost: num(c.cost) > 0 ? num(c.cost) : 50,
    maxPerDay: num(c.maxPerDay) > 0 ? num(c.maxPerDay) : 2,
    minLevel: num(c.minLevel) > 0 ? num(c.minLevel) : 5
  };
};

/* ---------------- Default level generator (Level 1..100) ----------------
   speed: 0.50 + 0.10 * (level-1) tokens per hour  (L1 = 0.50/h, L100 = 10.45/h)
   cost : 60 * 1.09^(level-1) tokens to reach this level (rounded)          */
function nxmDefLevels() {
  const out = [];
  for (let l = 1; l <= 100; l++) {
    out[l] = {
      level: l,
      speed: Math.round((0.5 + 0.1 * (l - 1)) * 100) / 100,
      cost: l === 1 ? 0 : Math.round(60 * Math.pow(1.09, l - 1) * 100) / 100,
      enabled: true,
      desc: ''
    };
  }
  return out;
}
function nxmLevels() {
  const store = (S.cfg && S.cfg.miningLevels) || {};
  const def = nxmDefLevels();
  for (let l = 1; l <= 100; l++) {
    const o = store[l] || store[String(l)];
    if (o && typeof o === 'object') {
      def[l] = { level: l, speed: num(o.speed) > 0 ? num(o.speed) : def[l].speed, cost: num(o.cost) >= 0 ? num(o.cost) : def[l].cost, enabled: o.enabled !== false, desc: o.desc || '' };
    }
  }
  return def;
}
const nxmLv = l => nxmLevels()[Math.max(1, Math.min(100, Math.floor(l)))];
const nxmRate = lvl => num(nxmLv(lvl).speed);           /* base speed: tokens/hour */
const nxmNextEnabled = l => { for (let i = l + 1; i <= 100; i++) if (nxmLv(i).enabled) return i; return 0; };

/* ---------------- Mining state machine ----------------
   db: users/{uid}/mining = { st, level, seq, upgSeq, sessStart, sessEnd, sessClaimed,
                              sessBoost, totalMined, freeUpgradeUsed, lastClaimAt,
                              lockOn, lockReason, lockAt }                        */
const MINE = () => (S.user && S.user.mining) || {};
function nxmStatus() {
  const m = MINE(), c = nxmCfg(), now = nowMs();
  if (!c.enabled) return { st: 'OFF' };
  if (m.lockOn || nxmInactivityDue()) return { st: 'LOCKED' };
  if (m.st === 'active') {
    if (now < (m.sessEnd || nxmExp(m))) return { st: 'MINING_ACTIVE', level: m.level };
    return { st: 'CLAIM_AVAILABLE', level: m.level };
  }
  if (m.st === 'claimed') return { st: 'CLAIMED', level: m.level };
  if (m.level >= c.maxLevel) return { st: 'MAX_LEVEL_REACHED', level: m.level };
  return { st: 'READY_TO_START', level: num(m.level) > 0 ? m.level : 1 };
}
const nxmExp = m => num(m.sessStart) + nxmCfg().sessionHours * 3600e3;
function nxmInactivityDue() {
  const m = MINE(), c = nxmInact();
  if (!c.enabled || m.st !== 'active') return false;
  return nowMs() > nxmExp(m) + c.thresholdHours * 3600e3;
}
function nxmRateNow(m) {
  m = m || MINE();
  let r = nxmRate(m.level || 1);
  if (m.st === 'active' && m.sessBoost && num(m.sessBoost.mult) > 1 && (!m.sessBoost.expiresAt || nowMs() < num(m.sessBoost.expiresAt))) r *= num(m.sessBoost.mult);
  return r;
}
function nxmSessEarned(m) {
  m = m || MINE();
  if (m.st !== 'active' || !m.sessStart) return 0;
  const durH = nxmCfg().sessionHours;
  const elapsed = Math.min(nowMs() - num(m.sessStart), durH * 3600e3) / 3600e3;
  return rnd(nxmRateNow(m) * elapsed, 4);
}
function nxmProjected() {
  const m = MINE();
  return m.st === 'active' ? rnd(nxmRateNow(m) * nxmCfg().sessionHours, 4) : 0;
}
const nxmTotalMined = () => num(MINE().totalMined);

/* ---------------- hms() lives with the countdown ticker in part 3 ---------------- */
function hms(ms) {
  ms = Math.max(0, ms);
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), hh = pad2(Math.floor(s % 86400 / 3600)), mm = pad2(Math.floor(s % 3600 / 60)), ss = pad2(s % 60);
  return (d > 0 ? d + 'd ' : '') + hh + ':' + mm + ':' + ss;
}

/* ---------------- Transaction helpers (same trust model as platform) ---------------- */
async function nxmCas(path, expect, fn) {
  const t = await db.ref(path).transaction(cur => (cur === expect ? fn(cur) : undefined));
  return t.committed;
}
async function nxmBusyWheel(on) { busy(on, on ? L2('Mining…', 'মাইনিং…') : ''); }

/* =====================================================================
   PHASE 1 — MINING PAGE
===================================================================== */
let MINE_HIST_LOADED = null;

  if (MINE_HIST_LOADED) return MINE_HIST_LOADED;
  try {
    const s = await db.ref('miningHistory/' + uid).orderByKey().limitToLast(30).once('value');
    MINE_HIST_LOADED = []; s.forEach(c => { const v = c.val(); if (v) MINE_HIST_LOADED.push(Object.assign({ key: c.key }, v)); });
    MINE_HIST_LOADED.reverse();
  } catch (e) { MINE_HIST_LOADED = []; }
  return MINE_HIST_LOADED;
}

function nxmStatusBadge(st) {
  const map = {
    READY_TO_START: ['fa-circle-play', L2('Ready to start', 'শুরু করার জন্য প্রস্তুত'), 'info'],
    MINING_ACTIVE: ['fa-satellite-dish', L2('Mining active', 'মাইনিং চালু আছে'), 'pos'],
    CLAIM_AVAILABLE: ['fa-unlock-keyhole', L2('Claim available', 'ক্লেইম উপলব্ধ'), 'warn'],
    CLAIMED: ['fa-circle-check', L2('Claimed — start next session', 'ক্লেইম হয়েছে — পরের সেশন শুরু করুন'), 'pos'],
    LOCKED: ['fa-lock', L2('Mining locked', 'মাইনিং লক করা'), 'neg'],

    OFF: ['fa-power-off', L2('Mining disabled by admin', 'অ্যাডমিন মাইনিং বন্ধ করেছেন'), 'neg']
  };
  const m = map[st] || ['', st, ''];
  return '<div class="nxm-badge ' + m[2] + '"><i class="fas ' + m[0] + '"></i> ' + m[1] + '</div>';
}

SUBS.mine = {
  title: () => L2('Token Mining', 'টোকেন মাইনিং'), live: true,
  after: () => { if (typeof nxmAutoLock === 'function') nxmAutoLock(); },
  render: () => {

        '<div class="nxm-live' + (active ? ' on' : '') + '"><span></span>' + (active ? L2('LIVE', 'লাইভ') : L2('IDLE', 'অপেক্ষা')) + '</div>' +

      '<div class="nxm-hero-sub">' + esc(lv.desc || L2('Current mining level', 'বর্তমান মাইনিং লেভেল')) + '</div>' +

           '<div class="kv"><span>' + L2('Expiration', 'শেষ সময়') + '</span><b>' + fdt(te) + '</b></div>' +
           '<div class="kv"><span>' + L2('Remaining time', 'বাকি সময়') + '</span><b class="pos" id="nxmCtd">—</b></div>' +
           '<div class="kv"><span>' + L2('Next claim', 'পরের ক্লেইম') + '</span><b>' + (canClaim ? '+ ' + fmt(earned, 4) + ' ' + esc(tsym()) : '+ ' + fmt(proj, 4) + ' ' + esc(tsym()) + ' ' + L2('at expiry', 'শেষে')) + '</b></div>';

    }

    else if (canClaim) h += '<button class="btn xp" data-act="mineClaim"><i class="fas fa-hammer"></i> ' + L2('CLAIM REWARD', 'ক্লেইম রিওয়ার্ড') + ' · +' + fmt(earned, 4) + ' ' + esc(tsym()) + '</button>';

      '<button class="btn xp2" data-act="openSub" data-id="mineboost"><i class="fas fa-rocket"></i> ' + L2('Mining Boost', 'মাইনিং বুস্ট') + '</button></div>';

    return h;
  }

function nxmHistHtml(list) {

SUBS.mineup = {

async function nxqSubmit(pick) {

  const ses = num(NXQ_TLEFT);

  }

    const fq = (window.NXQ_POOL || []).find(p => p.id === q.id) || {};

    window.NXQ_IN = false;
    NXQ_TLEFT = ses;
    toast(L2('Grading service unavailable — deploy Cloud Functions or enable fallback in Admin', 'গ্রেডিং পরিষেবা নেই — ক্লাউড ফাংশন ডিপ্লয় করুন বা অ্যাডমিনে ফলব্যাক চালু করুন'));

    }

  await db.ref('users/' + uid + '/quizAns/' + q.id).set({ qid: q.id, pick: pick, ok: !!res.correct, main: pm, token: pt, ts: nowMs() });
  await adjust('users/' + uid + '/quizStats/total', 1);
  if (res.correct) await adjust('users/' + uid + '/quizStats/correct', 1);
  if (pick >= 0) await adjust('users/' + uid + '/quizDaily/' + todayStr(), 1);
  if (pick >= 0) await adjust('users/' + uid + '/quizWeekly/' + nxqWeekKey(), 1);
  await db.ref('quizBoard/' + uid).transaction(cur => {
    const c0 = cur || {};
    return { id: uid, name: (tgUser && tgUser.first_name) || (S.user.name || 'User'), correct: num(c0.correct) + (res.correct ? 1 : 0), total: num(c0.total) + (pick >= 0 ? 1 : 0), token: rnd(num(c0.token) + pt, 4), main: rnd(num(c0.main) + pm, 4), t: nowMs() };

  window.NXQ_IN = false;
  renderSub(false);
  toast(res.correct ? L2('Correct! +', 'সঠিক! +') + [pm ? fmt(pm) + ' ' + sym() : '', pt ? fmt(pt, 4) + ' ' + tsym() : ''].filter(Boolean).join(' + ') : (pick < 0 ? L2('Time is up', 'সময় শেষ') : L2('Wrong answer', 'ভুল উত্তর')));

/* =====================================================================
   PHASE 1–3 — MINING / UPGRADE / BOOST / UNLOCK ACTIONS
   All sensitive paths use RTDB transactions + server-derived timestamps.
   A compare-and-set nonce (mining/seq, mining/upgSeq) makes every
   state transition single-winner: rejects double taps and repeated claims.
===================================================================== */
ACT.mineRefreshT = () => renderSub(false);

ACT.mineStart = async () => {
  const c = nxmCfg();
  if (!c.enabled) return toast(L2('Mining is disabled', 'মাইনিং বন্ধ আছে'));
  const S1 = nxmStatus();
  if (S1.st === 'LOCKED') return refreshSub();
  if (S1.st !== 'READY_TO_START' && S1.st !== 'CLAIMED') return refreshSub();
  if (window.NXQ_IN) return;
  window.NXQ_IN = true;
  busy(true, L2('Starting mining…', 'মাইনিং শুরু হচ্ছে…'));
  try {
    const m = MINE(), seq = num(m.seq);
    const bc = nxmBoostCfg();
    const bobj = (S.user && S.user.boost) || null;
    const boost = (bc.enabled && bobj && typeof bobj === 'object' && num(bobj.mult) > 1 && (!bobj.expiresAt || nowMs() < num(bobj.expiresAt))) ? { mult: num(bobj.mult), expiresAt: num(bobj.expiresAt) } : null;
    const ok = await nxmCas('users/' + uid + '/mining/seq', seq, () => seq + 1);
    if (!ok) { busy(false); window.NXQ_IN = false; return toast(L2('Session state changed — reloading', 'সেশন পরিবর্তন হয়েছে — রিফ্রেশ')); }
    await db.ref('users/' + uid + '/mining').update({
      st: 'active', seq: seq + 1,
      sessClaimed: null,
      sessStart: firebase.database.ServerValue.TIMESTAMP,
      sessEnd: firebase.database.ServerValue.TIMESTAMP + c.sessionHours * 3600e3,
      sessBoost: boost || null
    });
    toast(L2('Mining started · {0}h session', 'মাইনিং শুরু · {0} ঘণ্টা সেশন').replace('{0}', c.sessionHours));
    haptic(); renderSub(false); renderAll();
  } catch (e) { toast(L2('Could not start mining', 'মাইনিং শুরু করা যায়নি')); }
  window.NXQ_IN = false; busy(false);
};

ACT.mineClaim = async () => {
  const c = nxmCfg(), m = MINE();
  const S1 = nxmStatus();
  if (S1.st === 'LOCKED') return refreshSub();
  if (m.st !== 'active' || !m.sessStart) return refreshSub();
  if (nowMs() < num(m.sessEnd || nxmExp(m))) return toast(L2('Session not finished yet', 'সেশন এখনো শেষ হয়নি'));
  if (window.NXQ_IN) return;
  window.NXQ_IN = true;
  busy(true, L2('Claiming reward…', 'রিওয়ার্ড ক্লেইম হচ্ছে…'));
  try {
    const reward = nxmSessEarned(m);
    if (!(reward > 0)) { busy(false); window.NXQ_IN = false; return toast(L2('Nothing to claim', 'ক্লেইম করার কিছু নেই')); }
    const seq = num(m.seq);
    const ok = await nxmCas('users/' + uid + '/mining/seq', seq, () => seq + 1);
    if (!ok) { busy(false); window.NXQ_IN = false; return toast(L2('Already being claimed', 'ইতিমধ্যে ক্লেইম হচ্ছে')); }
    await db.ref('users/' + uid + '/mining').update({
      st: 'claimed', seq: seq + 1, sessClaimed: true,
      lastClaimAt: firebase.database.ServerValue.TIMESTAMP,
      totalMined: rnd(num(m.totalMined) + reward, 4)
    });
    const okBal = await adjUser(FIELD.token, reward);
    if (!okBal) {
      await db.ref('users/' + uid + '/mining').update({ st: 'active', seq: seq, sessClaimed: false, totalMined: num(m.totalMined) });
      busy(false); window.NXQ_IN = false; return toast(L2('Could not credit balance — try again', 'ব্যালেন্স যোগ করা যায়নি — আবার চেষ্টা করুন'));
    }
    await logLedger({ cat: 'reward', source: 'mining', amount: reward, unit: 'token', ref: 'lvl' + (num(m.level) || 1) });
    nxmLogHistory({ level: num(m.level) || 1, reward: reward, ts: nowMs(), session: c.sessionHours + 's' + 'h' });
    MINE_HIST_LOADED = null;
    toast('+' + fmt(reward, 4) + ' ' + tsym() + ' ' + L2('claimed!', 'ক্লেইম হয়েছে!'));
    haptic(); try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    renderSub(false); renderAll();
  } catch (e) { toast(L2('Claim failed — try again', 'ক্লেইম ব্যর্থ — আবার চেষ্টা করুন')); }
  window.NXQ_IN = false; busy(false);
};

ACT.mineUpgrade = async () => {
  const c = nxmCfg(), m = MINE();
  if (nxmStatus().st === 'LOCKED') return refreshSub();
  const lvl = num(m.level) > 0 ? m.level : 1;
  if (lvl >= c.maxLevel) return toast(L2('Maximum level reached', 'সর্বোচ্চ লেভেলে আছেন'));
  const nx = nxmNextEnabled(lvl);
  if (!nx) return toast(L2('No further levels enabled', 'আর কোনো লেভেল চালু নেই'));
  const freeAvail = c.freeUpgrade && !m.freeUpgradeUsed;
  const payTokens = freeAvail ? 0 : nxmLv(nx).cost;
  if (payTokens > 0 && num(S.user.tokenBalance) < payTokens) {
    toast(L2('Insufficient token balance (need {0})', 'পর্যাপ্ত টোকেন নেই ({0} প্রয়োজন)').replace('{0}', fmt(payTokens)));
    return;
  }
  if (window.NXQ_IN) return;
  window.NXQ_IN = true;
  busy(true, L2('Upgrading to level {0}…', 'লেভেল {0} আপগ্রেড হচ্ছে…').replace('{0}', nx));
  try {
    const prev = num(MINE().upgSeq);
    const okSeq = await nxmCas('users/' + uid + '/mining/upgSeq', prev, () => prev + 1);
    if (!okSeq) { busy(false); window.NXQ_IN = false; return toast(L2('Upgrade already in progress', 'আপগ্রেড ইতিমধ্যে চলছে')); }
    let okBal = true;
    if (payTokens > 0) okBal = await adjUser(FIELD.token, -payTokens);
    if (!okBal) { busy(false); window.NXQ_IN = false; return toast(L2('Insufficient token balance', 'পর্যাপ্ত টোকেন নেই')); }
    const okLvl = await nxmCas('users/' + uid + '/mining/level', lvl, () => nx);
    if (!okLvl) {
      if (payTokens > 0) await adjUser(FIELD.token, payTokens);
      busy(false); window.NXQ_IN = false; return toast(L2('Level changed concurrently — reloaded', 'লেভেল পরিবর্তন হয়েছিল — রিলোড'));
    }
    await db.ref('users/' + uid + '/mining/freeUpgradeUsed').set(true);
    const rec = { from: lvl, to: nx, cost: payTokens, free: payTokens <= 0, ts: firebase.database.ServerValue.TIMESTAMP };
    await db.ref('miningUpgrades/' + uid + '/' + ('U' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6))).set(rec);
    if (payTokens > 0) await logLedger({ cat: 'other', source: 'mining_upgrade', amount: -payTokens, unit: 'token', ref: 'lvl' + nx });
    await nxmLogHistory({ level: nx, reward: 0, ts: nowMs(), session: '', note: 'upgrade ' + lvl + '→' + nx + (payTokens <= 0 ? ' (free)' : ' · -' + fmt(payTokens) + ' ' + tsym()) });
    toast(L2('Level {0} unlocked · speed {1}/h', 'লেভেল {0} আনলক · গতি {1}/ঘণ্টা').replace('{0}', nx).replace('{1}', fmt(nxmLv(nx).speed)));
    haptic();
    S.upHist = null; renderSub(false); renderAll();
  } catch (e) { toast(L2('Upgrade failed', 'আপগ্রেড ব্যর্থ')); }
  window.NXQ_IN = false; busy(false);
};

/* =====================================================================
   PHASE 4 — STREAK CLAIM  (compare-and-set per-day key = duplicate-proof)
===================================================================== */
ACT.streakClaim = async () => {
  const c = NXS_CFG();
  if (!c.enabled) return;
  if (window.NXQ_IN) return;
  window.NXQ_IN = true;
  busy(true, L2('Claiming streak reward…', 'স্ট্রিক রিওয়ার্ড নেওয়া হচ্ছে…'));
  try {
    const day = todayStr(), st = nxsState();
    if (st.lastKey === day) { busy(false); window.NXQ_IN = false; return toast(L2('Already claimed today', 'আজ ক্লেইম হয়েছে')); }
    const g = await db.ref('users/' + uid + '/streak30/claims/' + day).transaction(cur => cur ? undefined : firebase.database.ServerValue.TIMESTAMP);
    if (!g.committed) { busy(false); window.NXQ_IN = false; return toast(L2('Already claimed today', 'আজ ক্লেইম হয়েছে')); }
    const yKey = new Date(nowMs() - 864e5).toISOString().slice(0, 10);
    const lv = num(st.lastKey) ? new Date(st.lastKey + 'T00:00:00Z').getTime() : 0;
    const withinWindow = st.lastKey === yKey || (st.lastKey && c.graceHours > 0 && nowMs() < lv + (24 + c.graceHours) * 3600e3 && st.day < 30);
    let nd = (st.lastKey === '' || (!withinWindow && c.resetMissed)) ? 1 : num(st.day) + 1;
    if (!c.resetMissed && st.lastKey && st.lastKey !== yKey) nd = num(st.day) + 1;
    if (nd > 30) nd = 1;
    const rw = nxsDayCfg(nd);
    const recs = [];
    if (rw.main > 0) {
      const okM = await earn(rw.main, 'streak', null, 'reward');
      if (okM) recs.push('+' + fmt(rw.main) + ' ' + sym());
    }
    if (rw.token > 0) {
      const okT = await adjust('users/' + uid + '/' + FIELD.token, rw.token);
      if (okT) { await logLedger({ cat: 'reward', source: 'streak', amount: rw.token, unit: 'token' }); recs.push('+' + fmt(rw.token, 4) + ' ' + tsym()); }
    }
    let bonus = [];
    if (nd === 30 && (num(c.bonusMain) > 0 || num(c.bonusToken) > 0)) {
      if (num(c.bonusMain) > 0) {
        const okB = await earn(num(c.bonusMain), 'streak_bonus', null, 'reward');
        if (okB) bonus.push('+' + fmt(c.bonusMain) + ' ' + sym() + ' bonus');
      }
      if (num(c.bonusToken) > 0) {
        const okB2 = await adjust('users/' + uid + '/' + FIELD.token, num(c.bonusToken));
        if (okB2) { await logLedger({ cat: 'reward', source: 'streak_bonus', amount: num(c.bonusToken), unit: 'token' }); bonus.push('+' + fmt(c.bonusToken, 4) + ' ' + tsym() + ' bonus'); }
      }
    }
    await db.ref('users/' + uid + '/streak30').update({
      day: nd, lastKey: day, best: Math.max(num(st.best), nd),
      ['history/' + nd]: day, ['historyKeys/' + day]: nd
    });
    await db.ref('dailyStreakClaims/' + uid + '/' + day).set({ day: nd, main: rw.main, token: rw.token, bonusMain: num(c.bonusMain) && nd === 30 ? num(c.bonusMain) : 0, bonusToken: num(c.bonusToken) && nd === 30 ? num(c.bonusToken) : 0, ts: nowMs() });
    toast((recs.concat(bonus).join(' + ') || L2('Claimed', 'ক্লেইম হয়েছে')) + ' · ' + L2('Day', 'দিন') + ' ' + nd);
    haptic(); try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    renderSub(false); renderAll();
  } catch (e) { toast(L2('Streak claim failed', 'স্ট্রিক ক্লেইম ব্যর্থ')); }
  window.NXQ_IN = false; busy(false);
};

/* ---------------- Lazy inactivity lock (works even before scheduler deploy) ---------------- */
async function nxmAutoLock() {
  try {
    const m = MINE();
    if (m.lockOn || m.st !== 'active') return;
    if (!nxmInactivityDue()) return;
    await db.ref('users/' + uid + '/mining').update({
      lockOn: true, lockReason: 'inactivity', lockAt: firebase.database.ServerValue.TIMESTAMP,
      st: 'ready', sessStart: null, sessEnd: null, sessClaimed: null, sessBoost: null
    });
    await nxmLogHistory({ level: num(m.level) || 1, reward: 0, ts: nowMs(), session: '', note: 'auto-locked · inactivity' });
  } catch (e) {}
}

/* periodic lazy inactivity lock sweep (60s) — complements the Cloud Functions scheduler */
setInterval(() => { if (S.booted && S.userReady) nxmAutoLock(); }, 60000);

  return '<div class="card nxm-suite' + (compact ? ' compact' : '') + '">' +
    '<div class="card-t"><i class="fas fa-gem"></i> ' + L2('Mining & Rewards', 'মাইনিং ও রিওয়ার্ডস') +
    (S1.st && states[S1.st] ? '<span class="nxm-mini-dot ' + states[S1.st] + '"></span><span class="nxm-mini-st">' + { MINING_ACTIVE: L2('MINING', 'চলছে'), CLAIM_AVAILABLE: L2('CLAIM!', 'ক্লেইম!'), LOCKED: L2('LOCKED', 'লকড') }[S1.st] + '</span>' : '') + '</div>' +
    '<div class="nxm-suite-grid">' + items.map(it =>
      '<button class="nxm-suite-b' + (it[0] === 'mine' && S1.st === 'CLAIM_AVAILABLE' ? ' glow' : '') + '" data-act="openSub" data-id="' + it[0] + '"><i class="' + it[1] + '"></i><b>' + it[2] + '</b><small>' + it[3] + '</small></button>').join('') +
    '</div></div>';
}
try {
  const _nxRenderProfile = renderProfile;
  renderProfile = function () {
    _nxRenderProfile();
    if (!nxmCfg().enabled && NXQ_CFG().enabled === false && NXS_CFG().enabled === false) return;
    const host = $('tab-profile');
    if (!host || host.querySelector('.nxm-suite')) return;
    host.insertAdjacentHTML('afterbegin', nxmSuiteCardHtml());
  };
} catch (e) {}
try {
  const _nxRenderToken = renderToken;
  renderToken = function () {
    _nxRenderToken();
    if (!nxmCfg().enabled) return;
    const host = $('tab-token');
    if (!host || host.querySelector('.nxm-suite')) return;
    host.insertAdjacentHTML('beforeend', nxmSuiteCardHtml(true));
  };
} catch (e) {}

/* ---------------- Bottom nav: add ALL PAGES item ---------------- */
try {
  (function nxmNavBtn() {
    const nav = $('nav'); if (!nav) return;
    nav.querySelector('.nav-in').insertAdjacentHTML('beforeend',
      '<button class="nv" data-act="openSub" data-id="allpages"><i class="fas fa-grip"></i><span data-i18n="nav_allpages">All Pages</span></button>');
    nav.classList.add('nv-six');
  })();
} catch (e) {}
D.nav_allpages = ['All Pages', 'সব পেজ'];

/* ---------------- Optional Cloud Functions adapter (secure quiz grading + scheduler) ---------------- */
try {
  (function () {
    if (typeof firebase.functions !== 'function') return;
    var fns = firebase.app().functions('us-central1');
    window.NXQ_CF = function (payload) {
      return new Promise(function (resolve, reject) {
        try {
          fns.httpsCallable('nxQuizSubmit')(payload)
            .then(function (r) {
              var v = (r && r.data) || {};
              if (v && typeof v.correct === 'boolean' && v.ok !== false) resolve(v); else resolve(null);
            })
            .catch(function (e) { console.warn('nxQuizSubmit unavailable', e && e.code); reject(e); });
        } catch (e) { reject(e); }
      });
    };
  })();
} catch (e) {}

</script>
</body>
